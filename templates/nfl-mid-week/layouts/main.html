  <style media="screen" type="text/css">
    @media screen and (max-width:599px) {
      .force-row, .container, .header, .body, .footer {

      .padr20 { padding-right: 12px !important }

      a.h1byline { line-height: 12px !important; padding-top: 8px; font-size: 10px !important; }
      
      /* Make section content images full-width on mobile, but not logos */
      .force-row img {
        width: 100% !important; 
        max-width: 100% !important;
        height: auto !important;
        margin-bottom: 15px !important;
      }

    img { -ms-interpolation-mode: bicubic; }
    a[href^="x-apple-data-detectors:"], a[x-apple-data-detectors] {
      color: inherit !important; text-decoration: none !important;
      font-size: inherit !important; font-family: inherit !important;
      font-weight: inherit !important; line-height: inherit !important;
    }


    .workbench {
      font-family: "Workbench", sans-serif;

      font-weight: 400 !important;
