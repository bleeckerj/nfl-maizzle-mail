<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-top: 28px; border-top: 2px solid #000000;">
  <tr>
    <td valign="top" align="left" style="padding: 14px 0 8px 0;">
      <if condition="footer.companyLogo">
        <img src="{{ footer.companyLogo }}" width="36" height="36" alt="{{ footer.brandName }}" style="display: block; width: 36px; height: 36px;">
      </if>
    </td>
  </tr>
  <tr>
    <td valign="top" align="left" style="font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 18px; color: #333333;">
      <p style="margin: 0 0 8px 0;">
        {{ footer.unsubscribeText }}
      </p>
      <p style="margin: 0 0 8px 0;">{{ footer.companyAddress }}</p>
      <p style="margin: 0 0 8px 0;">
        <each loop="link in footer.legalLinks">
          <a href="{{ link.url }}" style="color: #000000; font-weight: 700; text-decoration: underline;">{{ link.text }}</a><if condition="!@last"> &nbsp;|&nbsp; </if>
        </each>
      </p>
      <p style="margin: 0;">
        <a href="{{ footer.unsubscribeLink || '[unsubscribe]' }}" style="color: #000000; font-weight: 700; text-decoration: underline;" data-link-label="Unsubscribe" data-link-category="footer">Unsubscribe</a>
      </p>
    </td>
  </tr>
</table>
