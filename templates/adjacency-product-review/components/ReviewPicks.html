<if condition="reviewPicks">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-top: 28px;">
    <tr>
      <td valign="top" align="left" style="padding: 0 0 8px 0; border-top: 2px solid #000000;">
        <h2 class="review-section-title" style="margin: 12px 0 0 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 32px; line-height: 34px; font-weight: 800; color: #000000;">Our picks</h2>
      </td>
    </tr>
  </table>
  <each loop="pick in reviewPicks">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-top: 1px solid #d6d6d6;">
      <tr>
        <td valign="top" align="left" style="padding: 18px 0 22px 0;">
          <p class="review-mobile-meta" style="margin: 0 0 5px 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #d0021b;">{{ pick.label }}<if condition="pick.badge"> · {{ pick.badge }}</if></p>
          <h3 class="review-pick-title" style="margin: 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 26px; line-height: 29px; font-weight: 800; color: #000000;">{{ pick.title }}</h3>
          <p class="review-mobile-copy review-mobile-subtitle" style="margin: 7px 0 0 0; font-family: 'nyt-imperial', Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 23px; color: #222222;">{{ pick.subtitle }}</p>

          <if condition="pick.image">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-top: 14px;">
              <tr>
                <td valign="top" align="left">
                  <img src="{{ pick.image }}" width="360" alt="{{ pick.imageAlt }}" class="review-mobile-image" style="display: block; width: 360px; max-width: 100%; height: auto;">
                </td>
              </tr>
            </table>
          </if>

          <p class="review-mobile-meta" style="margin: 9px 0 0 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 13px; line-height: 17px; font-weight: 700; color: #000000;">{{ pick.priceText }}</p>
          <if condition="pick.merchantLinks">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top: 12px;">
              <each loop="link in pick.merchantLinks">
                <tr>
                  <td bgcolor="#111111" style="padding: 9px 13px; border-bottom: 4px solid #ffffff;">
                    <a href="{{ link.url }}" class="review-mobile-merchant-button" style="font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff; text-decoration: none;">{{ link.label }}<if condition="link.priceText"> · {{ link.priceText }}</if></a>
                  </td>
                </tr>
              </each>
            </table>
          </if>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-top: 14px;">
            <tr>
              <td valign="top" align="left" style="padding: 0;">
                <p class="review-mobile-meta" style="margin: 0 0 5px 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 14px; font-weight: 700; text-transform: uppercase;">What works</p>
                <ul class="review-mobile-compact-copy" style="margin: 0; padding: 0 0 0 18px; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px; color: #333333;">
                  <each loop="pro in pick.pros"><li style="margin: 0 0 4px 0;">{{ pro }}</li></each>
                </ul>
              </td>
            </tr>
            <tr>
              <td valign="top" align="left" style="padding: 13px 0 0 0;">
                <p class="review-mobile-meta" style="margin: 0 0 5px 0; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 14px; font-weight: 700; text-transform: uppercase;">Tradeoffs</p>
                <ul class="review-mobile-compact-copy" style="margin: 0; padding: 0 0 0 18px; font-family: 'nyt-franklin', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px; color: #333333;">
                  <each loop="con in pick.cons"><li style="margin: 0 0 4px 0;">{{ con }}</li></each>
                </ul>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </each>
</if>
