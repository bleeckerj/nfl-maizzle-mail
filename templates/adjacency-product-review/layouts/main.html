<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>{{ title }}</title>
  <style type="text/css">
    @font-face {
      font-family: 'nyt-cheltenham';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.theadjacency.com/fonts/family/cheltenham/cheltenham-normal-400.a3ed7afe3eaa0a873f3fbd379f8c491b.woff2') format('woff2');
    }
    @font-face {
      font-family: 'nyt-cheltenham';
      font-style: normal;
      font-weight: 700;
      src: url('https://fonts.theadjacency.com/fonts/family/cheltenham/cheltenham-normal-700.530cfb72378419eedb60da7e266ad5f1.woff2') format('woff2');
    }
    @font-face {
      font-family: 'nyt-franklin';
      font-style: normal;
      font-weight: 500;
      src: url('https://fonts.theadjacency.com/fonts/family/franklin/franklin-normal-500.0f4aea3d462cdb64748629efcbbf36bc.woff2') format('woff2');
    }
    @font-face {
      font-family: 'nyt-franklin';
      font-style: normal;
      font-weight: 700;
      src: url('https://fonts.theadjacency.com/fonts/family/franklin/franklin-normal-700.91eaf6b5642463af4091160b4bbfdfcb.woff2') format('woff2');
    }
    @font-face {
      font-family: 'nyt-franklin';
      font-style: normal;
      font-weight: 800;
      src: url('https://fonts.theadjacency.com/fonts/family/franklin/franklin-normal-800.fdc7cad17deeec2db1fe2f9f8c0520ed.woff2') format('woff2');
    }
    @font-face {
      font-family: 'nyt-imperial';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.theadjacency.com/fonts/family/imperial/imperial-normal-400.6131cd77b6e216c7693ed925f4309ffc.woff2') format('woff2');
    }
    body, table, td, p, a, li {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
    }
    a {
      color: inherit;
    }
    @media screen and (max-width: 620px) {
      .review-wrapper {
        width: 100% !important;
      }
      .review-pad {
        padding-left: 6px !important;
        padding-right: 6px !important;
      }
      .review-mobile-full {
        display: block !important;
        width: 100% !important;
      }
      .review-mobile-image {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
      }
      /* MOBILE FONT SIZE LOCK:
         Keep adjacency-product-review editorial copy larger on mobile. This
         intentionally overrides inline font sizes in email clients. Do not
         remove, lower, or narrow these selectors unless the operator explicitly
         requests that change and updates mobile-font-size-lock.test.mjs. */
      .review-headline,
      .review-section-title,
      .review-pick-title {
        font-size: 26px !important;
        line-height: 1.3 !important;
      }
      .review-mobile-copy,
      .review-mobile-copy p,
      .review-mobile-copy li,
      .review-body,
      .review-body p,
      .review-body li {
        font-size: 22px !important;
        line-height: 1.3 !important;
      }
      .review-mobile-subtitle {
        font-size: 23px !important;
        line-height: 1.3 !important;
      }
      .review-mobile-button,
      .review-mobile-button a {
        font-size: 23px !important;
        line-height: 1.3 !important;
      }
      .review-footer-cta-button {
        box-sizing: border-box !important;
        max-width: 100% !important;
        padding: 10px 14px !important;
        font-size: 14px !important;
        line-height: 16px !important;
        letter-spacing: 0.06em !important;
      }
      .review-mobile-grounding-block {
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      .review-mobile-context-note {
        box-sizing: border-box !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 12px !important;
      }
      .review-mobile-context-note-copy,
      .review-mobile-context-note-copy p,
      .review-mobile-context-note-copy li,
      .review-mobile-context-note-copy span,
      .review-mobile-context-note-copy a,
      .review-body .review-mobile-context-note-copy,
      .review-body .review-mobile-context-note-copy p,
      .review-body .review-mobile-context-note-copy li,
      .review-body .review-mobile-context-note-copy span,
      .review-body .review-mobile-context-note-copy a {
        font-size: 16px !important;
        line-height: 20px !important;
      }
      .review-mobile-context-note-meta,
      .review-mobile-context-note-meta span,
      .review-mobile-context-note-meta a,
      .review-body .review-mobile-context-note-meta,
      .review-body .review-mobile-context-note-meta span,
      .review-body .review-mobile-context-note-meta a {
        font-size: 12px !important;
        line-height: 1.1 !important;
      }
      .review-mobile-share-cta-copy,
      .review-mobile-share-cta-copy p,
      .review-mobile-share-cta-copy span,
      .review-mobile-share-cta-copy a,
      .review-body .review-mobile-share-cta-copy,
      .review-body .review-mobile-share-cta-copy p,
      .review-body .review-mobile-share-cta-copy span,
      .review-body .review-mobile-share-cta-copy a {
        font-family: 'nyt-franklin', Arial, Helvetica, sans-serif !important;
        font-size: 17px !important;
        line-height: 20px !important;
        font-weight: 800 !important;
        letter-spacing: -0.01em !important;
      }
      .review-mobile-merchant-button,
      .review-mobile-merchant-button a {
        font-size: 12px !important;
        line-height: 1.1 !important;
      }
      .review-mobile-caption {
        font-size: 18px !important;
        line-height: 1.2 !important;
      }
      .review-mobile-meta,
      .review-mobile-meta span,
      .review-mobile-meta a {
        font-size: 16px !important;
        line-height: 1.1 !important;
      }
      .review-mobile-compact-copy,
      .review-mobile-compact-copy p,
      .review-mobile-compact-copy li {
        font-size: 16px !important;
        line-height: 23px !important;
      }
      /* MOBILE AD FONT SIZE LOCK:
         Ads embedded in product-review bodyHtml must not inherit the large
         editorial .review-body p mobile copy size. Keep these selectors more
         specific than .review-body p and update mobile-font-size-lock.test.mjs
         if this intentional ad scale changes. */
      .review-mobile-ad-card {
        padding: 8px !important;
      }
      .review-mobile-ad-copy,
      .review-mobile-ad-copy p,
      .review-mobile-ad-copy li,
      .review-mobile-ad-copy span,
      .review-mobile-ad-copy a,
      .review-body .review-mobile-ad-copy,
      .review-body .review-mobile-ad-copy p,
      .review-body .review-mobile-ad-copy li,
      .review-body .review-mobile-ad-copy span,
      .review-body .review-mobile-ad-copy a {
        font-size: 16px !important;
        line-height: 19px !important;
      }
      .review-mobile-ad-label,
      .review-mobile-ad-label span,
      .review-mobile-ad-label a,
      .review-mobile-ad-sponsor,
      .review-mobile-ad-sponsor span,
      .review-mobile-ad-sponsor a,
      .review-mobile-ad-meta,
      .review-mobile-ad-meta span,
      .review-mobile-ad-meta a,
      .review-body .review-mobile-ad-label,
      .review-body .review-mobile-ad-label span,
      .review-body .review-mobile-ad-label a,
      .review-body .review-mobile-ad-sponsor,
      .review-body .review-mobile-ad-sponsor span,
      .review-body .review-mobile-ad-sponsor a,
      .review-body .review-mobile-ad-meta,
      .review-body .review-mobile-ad-meta span,
      .review-body .review-mobile-ad-meta a {
        font-size: 12px !important;
        line-height: 1 !important;
      }
      .review-body .review-mobile-context-note-copy,
      .review-body .review-mobile-context-note-copy p,
      .review-body .review-mobile-context-note-copy li,
      .review-body .review-mobile-context-note-copy span,
      .review-body .review-mobile-context-note-copy a {
        font-size: 16px !important;
        line-height: 20px !important;
      }
      .review-body .review-mobile-context-note-meta,
      .review-body .review-mobile-context-note-meta span,
      .review-body .review-mobile-context-note-meta a {
        font-size: 12px !important;
        line-height: 1.1 !important;
      }
      .review-body .review-mobile-share-cta-copy,
      .review-body .review-mobile-share-cta-copy p,
      .review-body .review-mobile-share-cta-copy span,
      .review-body .review-mobile-share-cta-copy a {
        font-family: 'nyt-franklin', Arial, Helvetica, sans-serif !important;
        font-size: 17px !important;
        line-height: 20px !important;
        font-weight: 800 !important;
        letter-spacing: -0.01em !important;
      }
      .review-body h1,
      .review-body h2,
      .review-body h3,
      .review-body h4 {
        font-family: 'nyt-franklin', Arial, Helvetica, sans-serif !important;
        font-weight: 800 !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; width: 100%; background-color: #ffffff; word-break: break-word; -webkit-font-smoothing: antialiased;">
  <div style="display:none; font-size:0; line-height:0; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 100%;">
    <tr>
      <td align="center" valign="top" style="padding: 0;">
        <table role="presentation" class="review-wrapper" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 600px; max-width: 600px;">
          <tr>
            <td class="review-pad" width="100%" valign="top" style="width: 100%; padding: 20px 12px;">
              <table role="presentation" width="576" cellpadding="0" cellspacing="0" border="0" class="review-wrapper" style="width: 576px; max-width: 576px;">
                <tr>
                  <td width="100%" valign="top" align="left" style="width: 100%;">
                    <block name="template"></block>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
