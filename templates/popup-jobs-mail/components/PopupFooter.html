<tr>
  <td style="padding: 0 28px 28px 28px; background: {{ jobPopupMail.brand.theme.surfaceColor }};">
    <table width="100%" cellpadding="0" cellspacing="0" style="border-spacing: 0; background: {{ jobPopupMail.brand.theme.surfaceAltColor }}; border: 1px solid {{ jobPopupMail.brand.theme.borderColor }};">
      <tbody>
        <if condition="jobPopupMail.explainerHtml">
          <tr>
            <td style="padding: 20px 20px 0 20px;">
              <div style="font-family: {{ jobPopupMail.brand.theme.metaFontFamily }}; font-size: 11px; line-height: 1.4; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{ jobPopupMail.brand.theme.mutedColor }};">Explainer</div>
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 20px 0 20px;">
              <div style="font-family: {{ jobPopupMail.brand.theme.bodyFontFamily }}; font-size: 15px; line-height: 1.7; color: {{ jobPopupMail.brand.theme.textColor }};">
                {{{ jobPopupMail.explainerHtml }}}
              </div>
            </td>
          </tr>
        </if>

        <if condition="jobPopupMail.footerCta">
          <tr>
            <td style="padding: 20px 20px 0 20px;">
              <div style="font-family: {{ jobPopupMail.brand.theme.metaFontFamily }}; font-size: 11px; line-height: 1.4; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{ jobPopupMail.brand.theme.mutedColor }};">{{ jobPopupMail.footerCta.eyebrow }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 20px 0 20px;">
              <div style="font-family: {{ jobPopupMail.brand.theme.bodyFontFamily }}; font-size: 15px; line-height: 1.7; color: {{ jobPopupMail.brand.theme.textColor }};">
                {{{ jobPopupMail.footerCta.textHtml }}}
              </div>
            </td>
          </tr>
        </if>

        <if condition="jobPopupMail.primaryAction || jobPopupMail.secondaryAction">
          <tr>
            <td class="popup-jobs-mail-actions" style="padding: 18px 20px 0 20px;">
              <if condition="jobPopupMail.primaryAction">
                <a
                  href="{{ jobPopupMail.primaryAction.url }}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="display: inline-block; margin: 0 12px 12px 0; padding: 12px 16px; text-decoration: none; font-family: {{ jobPopupMail.brand.theme.metaFontFamily }}; font-size: 12px; line-height: 1.2; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; background: {{ jobPopupMail.brand.theme.ctaPrimaryBackground }}; color: {{ jobPopupMail.brand.theme.ctaPrimaryText }} !important; border: 1px solid {{ jobPopupMail.brand.theme.ctaPrimaryBorder }}; -webkit-text-fill-color: {{ jobPopupMail.brand.theme.ctaPrimaryText }};"
                >{{ jobPopupMail.primaryAction.label }}</a>
              </if>
              <if condition="jobPopupMail.secondaryAction">
                <a
                  href="{{ jobPopupMail.secondaryAction.url }}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="display: inline-block; margin: 0 12px 12px 0; padding: 12px 16px; text-decoration: none; font-family: {{ jobPopupMail.brand.theme.metaFontFamily }}; font-size: 12px; line-height: 1.2; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; background: {{ jobPopupMail.brand.theme.ctaSecondaryBackground }}; color: {{ jobPopupMail.brand.theme.ctaSecondaryText }} !important; border: 1px solid {{ jobPopupMail.brand.theme.ctaSecondaryBorder }}; -webkit-text-fill-color: {{ jobPopupMail.brand.theme.ctaSecondaryText }};"
                >{{ jobPopupMail.secondaryAction.label }}</a>
              </if>
            </td>
          </tr>
        </if>

        <tr>
          <td style="padding: 10px 20px 20px 20px;">
            <p style="margin: 0; font-family: {{ jobPopupMail.brand.theme.metaFontFamily }}; font-size: 11px; line-height: 1.5; letter-spacing: 0.05em; color: {{ jobPopupMail.brand.theme.mutedColor }}; text-transform: uppercase;">
              <a href="{{ jobPopupMail.targetUrl }}" target="_blank" rel="noopener noreferrer" style="color: {{ jobPopupMail.brand.theme.mutedColor }}; text-decoration: underline;">Open popup version</a>
            </p>
          </td>
        </tr>
      </tbody>
    </table>
  </td>
</tr>
