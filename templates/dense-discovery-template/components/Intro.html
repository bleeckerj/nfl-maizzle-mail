<!-- Intro Component -->
<!-- Purpose: Introduces the newsletter issue and provides a personal message -->
<!-- Variables: issueNumber, introText, articleLink, authorLink -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="intro">
        <p>{{ issueNumber }}</p>
        <p>{{ introText }}</p>
        <p>{{ articleLink }}</p>
        <p>{{ authorLink }}</p>
      </div>
    </td>
  </tr>
</table>
