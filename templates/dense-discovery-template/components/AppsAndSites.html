<!-- AppsAndSites Component -->
<!-- Purpose: Lists recommended apps and sites -->
<!-- Variables: appTitle, appDescription, appLink -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="appsandsites">
        <p>{{ appTitle }}</p>
        <p>{{ appDescription }}</p>
        <p>{{ appLink }}</p>
      </div>
    </td>
  </tr>
</table>
