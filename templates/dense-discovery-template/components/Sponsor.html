<!-- Sponsor Component -->
<!-- Purpose: Highlights a sponsor with an image and description -->
<!-- Variables: sponsorTitle, sponsorLink, sponsorImage, sponsorDescription -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="sponsor">
        <p>{{ sponsorTitle }}</p>
        <p>{{ sponsorLink }}</p>
        <p>{{ sponsorImage }}</p>
        <p>{{ sponsorDescription }}</p>
      </div>
    </td>
  </tr>
</table>
