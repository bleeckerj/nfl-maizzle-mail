<!-- Header Component -->
<!-- Purpose: Displays the email header with a quote and featured artist -->
<!-- Variables: quote, author, artistName, artistLink, headerImage -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="header">
        <p>{{ quote }}</p>
        <p>{{ author }}</p>
        <p>{{ artistName }}</p>
        <p>{{ artistLink }}</p>
        <p>{{ headerImage }}</p>
      </div>
    </td>
  </tr>
</table>
