<!-- FeaturedArticle Component -->
<!-- Main article with large headline, hero image, and detailed content -->
<!-- Variables: , , , , , ,  -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;"><tr><td width="100%" valign="top" align="center" style="padding: 30px 0px 0px; width: 100%;"><p height="5" width="100%" style="mso-line-height-rule:exactly; mso-table-lspace:0pt; mso-table-rspace:0pt; text-size-adjust:100%; width: 100%; height: 5px; max-height: 5px; background-color: #000000; margin: 0px; font-size: 5px; line-height: 5px">&nbsp;</p></td></tr><tr><td width="100%" valign="top" align="left" class="fz-28-lh-10" style="text-align: left; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 46px; font-weight: 700; letter-spacing: -0.03em; line-height: 48px; padding-bottom: 20px; width: 100%;"><p style="margin: 0px;"><span style="font-size: 46px; line-height: 48px; color: #000000;"><a style="color: #000000;" href="{{ featuredArticle.ctaLink }}">{{ featuredArticle.headline }}</a></span></p></td></tr><tr><td width="100%" valign="top" align="left" class="st-dynamic-2420-4" style="padding-bottom: 5px; width: 100%;"><a href="{{ featuredArticle.ctaLink }}" target="_blank" style="display: block;"><img border="0" valign="top" width="560" src="{{ featuredArticle.heroImage }}" alt="{{ featuredArticle.heroImageAlt }}" class="st-mobile-width-constraint" style="border: 0px; display: block; width: 560px; max-width: 100%;"></a></td></tr><tr><td width="100%" valign="top" align="left" style="text-align: left; font-family: Helvetica, Arial, sans-serif; color: #808080; font-size: 11px; font-weight: normal; letter-spacing: normal; line-height: 11px; padding-bottom: 20px; width: 100%;"><p style="margin: 0px; text-align: right;"><span style="font-size: 11px; line-height: 11px;">{{ featuredArticle.photoCredit }}</span></p></td></tr><tr><td width="100%" valign="top" align="left" class="ul-pt-20 wirecutter-mobile-copy" style="text-align: left; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 16px; font-weight: normal; letter-spacing: normal; line-height: 24px; width: 100%;">{{{ featuredArticle.description }}}</td></tr><if condition="featuredArticle.disclaimer"><tr><td width="100%" valign="top" align="center" style="padding: 0px; width: 100%;"><p height="40" width="100%" style="mso-line-height-rule:exactly; mso-table-lspace:0pt; mso-table-rspace:0pt; text-size-adjust:100%; width: 100%; height: 40px; max-height: 40px; margin: 0px; font-size: 40px; line-height: 40px">&nbsp;</p></td></tr><tr><td width="100%" valign="top" align="left" bgcolor="#E2DFDA" class="fz-12-lh-16 wirecutter-mobile-disclaimer" style="text-align: left; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 14px; font-weight: normal; letter-spacing: normal; line-height: 17px; padding: 25px 20px; width: 100%;">{{{ featuredArticle.disclaimer }}}</td></tr></if></table>
