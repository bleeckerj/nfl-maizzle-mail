<!-- Article Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 0; margin: 0 auto; max-width: 600px; text-align: left;">
      <div class="body-content">
        <h2 style="font-family: 'Lora',serif;margin: 0;padding: 48px 0 0;font-size: 36px;line-height: 1.2em;font-weight: 400;">
          <a href="{{ article.url }}" style="color: #DC4B4B;text-decoration: none;">{{ article.title }}</a>
        </h2>
        <p style="font-size: 18px;line-height: 1.6em;">{{ article.content }}</p>
        
        {% if article.blockquotes %}
        {% for quote in article.blockquotes %}
        <blockquote style="margin: 40px 0;padding: 0 0 0 20px;border-left: 1px solid #B7E2D8;">
          {% for paragraph in quote.paragraphs %}
          <p style="font-size: 17px;line-height: 1.6em;font-family: 'Lora',serif;">
            {% if paragraph.highlight %}
            <span class="highlight" style="background: #B7E2D8;">{{ paragraph.text }}</span>
            {% else %}
            {{ paragraph.text }}
            {% endif %}
          </p>
          {% endfor %}
        </blockquote>
        {% endfor %}
        {% endif %}
      </div>
    </td>
  </tr>
</table>
