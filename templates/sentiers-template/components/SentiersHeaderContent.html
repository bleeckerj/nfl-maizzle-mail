<!-- Header Content Summary Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 0; margin: 0 auto; max-width: 600px; text-align: left;">
      <div class="header-content">
        <p style="font-size: 18px;line-height: 1.6em;">
          <strong class="caps" style="text-transform: uppercase;font-weight: bold;letter-spacing: .05em;font-size: 85%;">This week &rarr;</strong> 
          {{ headerContent.thisWeek }}
        </p>
        <p style="font-size: 18px;line-height: 1.6em;">
          <strong class="caps" style="text-transform: uppercase;font-weight: bold;letter-spacing: .05em;font-size: 85%;">A year ago &rarr;</strong> 
          <a href="{{ headerContent.yearAgo.url }}" style="color: #DC4B4B;text-decoration: none;">{{ headerContent.yearAgo.title }}</a>.
        </p>
      </div>
    </td>
  </tr>
</table>
