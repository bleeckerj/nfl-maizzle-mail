<!-- Featured Image Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 0; margin: 0 auto; max-width: 600px; text-align: left;">
      <a href="{{ featuredImage.url }}" target="_blank" style="color: #DC4B4B;text-decoration: none;">
        <img src="{{ featuredImage.src }}" alt="{{ featuredImage.alt }}" border="0" style="margin: 0;padding: 0;max-width: 100%;height: auto;">
      </a>
      <p class="legend" style="font-size: 12px;line-height: 1.6em;margin: 5px 0 0;padding: 0;text-align: center;">
        <a href="{{ featuredImage.url }}" style="color: #DC4B4B;text-decoration: none;">{{ featuredImage.caption }}</a>
      </p>
    </td>
  </tr>
</table>
