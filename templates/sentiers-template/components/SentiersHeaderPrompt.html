<!-- Header Prompt (Membership CTA) Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 0; margin: 0 auto; max-width: 600px; text-align: left;">
      <div class="header-prompt">
        <br>
        <p style="font-size: 14px;line-height: 1.6em;">
          <span style="display:block;text-align: center;">—</span>
          {{ headerPrompt.text }} 
          <a href="{{ headerPrompt.membershipUrl }}" style="color: #DC4B4B;text-decoration: none;">
            <strong>{{ headerPrompt.ctaText }}</strong>
          </a>.
        </p>
      </div>
    </td>
  </tr>
</table>
