<!-- Poem Section Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff;">
  <tr>
    <td align="left" valign="top" style="padding: 0 24px 24px 24px;">
      <div class="c-rich-text">
        <!-- Poem section -->
        <h1 style="margin: 0 0 24px 0; padding: 0; font-family: 'Graphik', Arial, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2; color: #21272c;">
          <a href="{{ mainContent.poem.link }}" style="color: #21272c; text-decoration: none;">
            {{ mainContent.poem.title }}
          </a>
        </h1>
        
        <!-- Poem image -->
        <div class="c-imgblock" style="margin: 0 0 24px 0;">
          <a href="{{ mainContent.poem.link }}" style="text-decoration: none;">
            <img src="{{ mainContent.poem.image }}" alt="{{ mainContent.poem.title }}" width="588" 
                 style="border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; width: 100%; max-width: 588px;">
          </a>
        </div>
        
        <!-- Poem excerpt -->
        <blockquote style="margin: 0 0 24px 0; padding: 0 0 0 24px; border-left: 4px solid #ef3b24; font-style: italic;">
          <p style="margin: 0; padding: 0; font-family: 'Lyon Text', Georgia, serif; font-size: 17px; line-height: 1.4; color: #21272c; white-space: pre-line;">{{ mainContent.poem.excerpt }}</p>
          <cite style="display: block; margin-top: 12px; font-size: 14px; color: #5e6a74; font-style: normal;">
            — {{ mainContent.poem.author }}
          </cite>
        </blockquote>
      </div>
    </td>
  </tr>
</table>
