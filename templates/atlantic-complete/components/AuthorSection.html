<!-- Author Section Component -->
<table class="c-author" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff; border-collapse: collapse;">
  <tr>
    <td align="left" valign="top" class="c-author__content" style="padding: 0 24px 24px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td align="left" valign="center" class="c-author__headshot" style="width: 74px; padding-right: 12px;">
            <a href="{{ author.link }}" style="text-decoration: none;">
              <img src="{{ author.image }}" alt="{{ author.name }} headshot" width="50" height="50" 
                   class="c-author__img" style="border: 0; border-radius: 50%; line-height: 100%; outline: none; text-decoration: none; width: 50px; height: 50px;">
            </a>
          </td>
          <td align="left" valign="center" class="c-author__bio">
            <p style="margin: 0; padding: 0; font-family: 'Lyon Text', Georgia, serif; font-size: 14px; line-height: 1.4; color: #21272c;">
              <a href="{{ author.link }}" class="c-author__link" style="color: #21272c; text-decoration: none; font-weight: 600;">
                {{ author.name }}
              </a>
              <br>
              <span style="color: #5e6a74;">{{ author.bio }}</span>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
