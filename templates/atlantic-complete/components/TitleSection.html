<!-- Title Section Component -->
<if condition="mainContent.title">
  <table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff;">
    <tr>
      <td align="left" valign="top" style="padding: 0 24px 32px 24px;">
        <h1 style="margin: 0; padding: 0; font-family: 'Graphik', Arial, sans-serif; font-size: 28px; font-weight: bold; line-height: 1.2; color: #21272c; text-align: left;">
          <if condition="mainContent.link">
            <a href="{{ mainContent.link }}" style="color: #21272c; text-decoration: none; font-weight: bold;">
              <strong>{{ mainContent.title }}</strong>
            </a>
          </if>
          <if condition="!mainContent.link">
            <strong>{{ mainContent.title }}</strong>
          </if>
        </h1>
      </td>
    </tr>
  </table>
</if>
