<!-- Date Section Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff;">
  <tr>
    <td align="center" valign="top" style="padding: 0 24px 24px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td align="center" valign="top" class="e-h4__container">
            <h4 style="margin: 0; padding: 0; font-family: 'Graphik', Arial, sans-serif; font-size: 14px; font-weight: 600; color: #5e6a74; text-transform: uppercase; letter-spacing: 0.5px;">
              {{ date }}
            </h4>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
