<!-- Footer Component -->
<table class="c-dailyfooter" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f7fafa;">
  <tr>
    <td align="center" valign="top" style="padding: 32px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        
        <!-- Atlantic Logo -->
        <tr>
          <td align="center" valign="top" style="padding: 0 0 24px 0;">
            <img src="{{ footer.atlanticLogo }}" alt="The Atlantic" width="146" 
                 style="border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; width: 146px; max-width: 100%;">
          </td>
        </tr>
        
        <!-- Footer Links -->
        <tr>
          <td align="center" valign="top" style="padding: 0 0 24px 0;">
            <p style="margin: 0; padding: 0; font-family: 'Graphik', Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #5e6a74;">
              <a href="{{ footer.unsubscribeLink }}" class="c-dailyfooter__link" style="color: #5e6a74; text-decoration: underline;">
                Unsubscribe
              </a>
              |
              <a href="{{ footer.managePreferencesLink }}" class="c-dailyfooter__link" style="color: #5e6a74; text-decoration: underline;">
                Manage email preferences
              </a>
            </p>
          </td>
        </tr>
        
        <!-- Address -->
        <tr>
          <td align="center" valign="top">
            <p style="margin: 0; padding: 0; font-family: 'Graphik', Arial, sans-serif; font-size: 12px; line-height: 1.4; color: #8592a4; white-space: pre-line;">
              {{ footer.address }}
            </p>
          </td>
        </tr>
        
      </table>
    </td>
  </tr>
</table>
