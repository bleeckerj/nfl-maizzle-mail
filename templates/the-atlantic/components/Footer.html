<!--
  Newsletter Footer
  Dark global footer with wordmark, newsletter name, signup note, subscribe links and social icons.

  Slots:
  - wordmark_src (image_url) — Atlantic wordmark image URL
  - newsletter_name (text) — Newsletter name title
  - info_html (rich_text) — Info paragraph with see-all newsletters link
  - subscribe_html (rich_text) — Subscribe + app links paragraph
  - social_html (rich_text) — Social icons block HTML

  Used by section indexes: [10] in the source email.
  Reference only — render-time dispatch is in templates/<name>/newsletter.html.
-->
<div class="c-footer full-wrap" style="background-color: #39434b; color: #ffffff; font-family: 'Graphik', -apple-system, BlinkMacSystemFont, 'Google Sans', 'Roboto', 'Helvetica Neue', Helvetica, Segoe UI, Arial, sans-serif; text-align: left; font-size: 12px;">
  <div class="c-footer__break" style="display: none; mso-hide: all; max-height: 0px; overflow: hidden;"><hr></div>
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="-webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important;">
    <tbody><tr>
      <td align="left" valign="center" class="c-dailyfooter" style="-webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-table-lspace: 0pt; mso-table-rspace: 0pt; padding: 48px 24px 32px 24px; background-color: #39434b; width: 100%;" width="100%" bgcolor="#39434b">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="-webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important;">
          <tbody><tr>
            <td class="c-dailyfooter__logo" style="-webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 146px; padding: 0 0 24px 0;" width="146">
              <img src="{{ section.wordmark_src }}" width="146" class="js-text-remove" style="-ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none;">
            </td>
          </tr>
          <tr><td><p class="c-dailyfooter__title" style="color: #ffffff; text-transform: uppercase; margin: 0 0 16px 0;">{{ section.newsletter_name }}</p></td></tr>
          <tr><td><p class="c-dailyfooter__info" style="color: #ffffff; margin: 0 0 16px 0;">{{{ section.info_html }}}</p></td></tr>
          <tr><td><p class="c-dailyfooter__subscribe" style="color: #ffffff; margin: 0 0 32px 0;">{{{ section.subscribe_html }}}</p></td></tr>
          <tr><td>{{{ section.social_html }}}</td></tr>
        </tbody></table>
      </td>
    </tr></tbody>
  </table>
</div>
