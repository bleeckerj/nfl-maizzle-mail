<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #1d1d1f; color: #d9d9d9;">
  <tr>
    <td class="mf-shell mf-pad" style="padding: 28px;">
      <p style="margin: 0 0 10px; font-size: 13px; line-height: 18px; color: #ffffff;">{{ footer.brandName }}</p>
      <p style="margin: 0 0 18px; font-size: 12px; line-height: 17px;">{{ footer.unsubscribeText }}</p>
      <p style="margin: 0; font-size: 12px; line-height: 18px;">
        <a href="{{ footer.unsubscribeLink }}" style="color: #ffffff; text-decoration: underline;">Unsubscribe</a>
        <each loop="link in footer.legalLinks">
          &nbsp;·&nbsp;<a href="{{ link.url }}" style="color: #ffffff; text-decoration: underline;">{{ link.text }}</a>
        </each>
      </p>
      <p style="margin: 18px 0 0; font-size: 11px; line-height: 15px; color: #999999;">{{ footer.companyAddress }}</p>
    </td>
  </tr>
</table>
