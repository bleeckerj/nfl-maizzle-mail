<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>{{{ page.title }}}</title>
  <style type="text/css">
    body { margin: 0; padding: 0; background: #f5f3ef; color: #1d1d1f; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    img { border: 0; display: block; height: auto; max-width: 100%; }
    a { color: inherit; }
    .mf-shell { width: 100%; max-width: 680px; margin: 0 auto; }
    .mf-copy { font-size: 17px; line-height: 1.52; }
    .mf-meta { font-size: 11px; line-height: 1.35; letter-spacing: .12em; text-transform: uppercase; }
    .mf-heading { letter-spacing: -.04em; }
    @media screen and (max-width: 599px) {
      .mf-shell { width: 100% !important; }
      .mf-pad { padding-left: 18px !important; padding-right: 18px !important; }
      .mf-heading { font-size: 34px !important; line-height: 1.02 !important; }
      .mf-section-heading { font-size: 28px !important; line-height: 1.08 !important; }
      .mf-copy, .mf-copy p, .mf-copy li { font-size: 17px !important; line-height: 1.52 !important; }
      .mf-image { width: 100% !important; height: auto !important; }
      .mf-two-col { display: block !important; width: 100% !important; }
      .mf-two-col td { display: block !important; width: auto !important; padding-left: 0 !important; padding-right: 0 !important; }
    }
  </style>
</head>
<body>
  <div role="article" aria-roledescription="email" aria-label="{{ page.title }}">
    <block name="template"></block>
  </div>
</body>
</html>
