<!--
  Archive CTA Banner
  Centered text prompt with a large red CTA button, inviting readers to explore the full archive.

  Slots:
  - prompt_text (text) — Centered prose prompt above the button
  - cta_href (link_url) — CTA button link URL
  - cta_label (link_label) — CTA button label text

  Used by section indexes: [6] in the source email.
  Reference only — render-time dispatch is in templates/<name>/newsletter.html.
-->
<table align="center" border="0" cellpadding="0" cellspacing="0" class="full-width" style="width:650px;min-width:650px;" width="650">
  <tbody><tr>
    <td bgcolor="#ffffff" class="main-text-welcome" style="text-align:left;padding: 0px 45px 0px 45px;font-size: 1px; color: #e8e7e7; mso-line-height-rule: exactly; line-height: 1px; border-bottom: 1px solid #e8e7e7;font-size: 1px; color: #e8e7e7; mso-line-height-rule: exactly; line-height: 1px; border-top: 1px solid #e8e7e7;" valign="top" width="650">
      <div style="color: #000000; text-decoration: none; text-align: center;font-size:22px; line-height:26px; font-family: Georgia, times, serif;padding:40px 0px 40px 0px; ">{{ section.prompt_text }}</div>
      <table align="center" border="0" cellpadding="0" cellspacing="0" class="image-width-290" style="padding: 0px 0px 40px 0px;" width="290">
        <tbody><tr>
          <td bgcolor="#DF3331" height="48" style="font-family:helvetica, arial, sans-serif;font-size:14px;line-height:30px;padding:0px 17px 00px 17px;text-align:center;border-radius:2px;color:#ffffff;font-weight:bold;" valign="middle" width="100%"><a href="{{ section.cta_href }}" name="explore_cta" style="text-decoration:none;color:#ffffff;display:block;" target="_blank">{{ section.cta_label }}</a></td>
        </tr></tbody>
      </table>
    </td>
  </tr></tbody>
</table>
