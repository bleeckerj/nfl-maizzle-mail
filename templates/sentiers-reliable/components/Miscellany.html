<!-- Miscellany Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <ul class="miscellany" style="font-size: 18px;margin: 24px 0 0;padding: 0;">
        <each loop="item in miscellanyItems">
          <li style="margin: 0;padding: 12px 0;list-style: none;border-top: 1px solid #B7E2D8;line-height: 1.4em;">
            <a href="{{ item.url }}" style="color: #DC4B4B;text-decoration: none;">{{ item.title }}</a>
            {{{ item.description }}}
          </li>
        </each>
      </ul>
    </td>
  </tr>
</table>
