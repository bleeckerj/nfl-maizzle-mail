<!-- Digital Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 30px 20px; background-color: #ffffff;">
      <h2 style="font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; color: #000000; margin: 0 0 20px 0; border-bottom: 2px solid #addcfa; padding-bottom: 10px;">
        📱 Digital
      </h2>
      
      <!-- Apps and Sites List -->
      <div style="margin-bottom: 20px;">
        <each loop="item in digitalItems">
          <div style="margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #ebebeb;">
            <h3 style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; color: #000000; margin: 0 0 8px 0;">
              <a href="{{ item.appLink || 'https://example.com/app' }}" style="color: #000000; text-decoration: underline;">
                {{ item.appName || 'Digital Tool' }}
              </a>
            </h3>
            <p style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #333333; margin: 0;">
              {{ item.appDescription || 'A powerful digital tool for productivity and creativity.' }}
            </p>
          </div>
        </each>
      </div>
    </td>
  </tr>
</table>
