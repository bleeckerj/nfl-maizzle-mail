<!-- Header Component - Dense Discovery Style -->
<table bgcolor="#FFFFFF" border="0" cellpadding="0" cellspacing="0" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="100%">
  <tbody>
    <tr>
      <td align="center" bgcolor="#addcfa" style="border-collapse: collapse;" valign="top">
        <!-- 640px container -->
        <table border="0" cellpadding="0" cellspacing="0" class="header mobt0" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 640px;max-width: 640px;padding-top: 20px;" width="640">
          <tbody>
            <tr>
              <td align="left" style="border-collapse: collapse;">
                
                <!--[if mso]>
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr><td width="35%" valign="top"><![endif]-->
                
                <!-- Quote Section (Left Column) -->
                <table align="left" border="0" cellpadding="0" cellspacing="0" class="force-row" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="224">
                  <tbody>
                    <tr>
                      <td class="padt15 padr10 padb5 padl20" style="border-collapse: collapse;padding-top: 15px;padding-right: 10px;padding-bottom: 5px;padding-left: 20px;" valign="top">
                        <p class="marb5" style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 0;margin: 0;margin-bottom: 5px;">
                          {{ quote }}
                        </p>
                        <p class="marb0" style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 0;margin: 0;margin-bottom: 0;">
                          <b style="font-weight: 600;">– {{ author }}</b>
                        </p>
                      </td>
                    </tr>
                  </tbody>
                </table>
                
                <!--[if mso]></td><td width="65%" valign="top"><![endif]-->
                
                <!-- Featured Artist Image (Right Column) -->
                <table align="right" border="0" cellpadding="0" cellspacing="0" class="force-row" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="416">
                  <tbody>
                    <tr>
                      <td align="right" class="padt20 padr20 padb5 padl10" style="border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-bottom: 5px;padding-left: 10px;" valign="top">
                        <p class="marb5" style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 0;margin: 0;margin-bottom: 5px;">
                          <img src="{{ headerImage || 'https://picsum.photos/386/200?random=1' }}" alt="Header artwork" width="386" height="auto" class="img" style="-ms-interpolation-mode: bicubic;display: block;max-height: 900px;max-width: 416px;width: 100%;">
                        </p>
                        <p class="marb0 mobb15 align-left" style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 0;margin: 0;margin-bottom: 0;">
                          Featured artist: <a href="{{ artistLink }}" style="text-decoration: underline;color: #000000 !important;">{{ artistName }}</a>
                        </p>
                      </td>
                    </tr>
                  </tbody>
                </table>
                
                <!--[if mso]></td></tr></table><![endif]-->
                
              </td>
            </tr>
            
            <!-- Top Logo -->
            <tr>
              <td align="left" class="tighten" style="border-collapse: collapse;font-size: 1px;line-height: 1px;" valign="bottom">
                <a href="{{ logoLink || '#' }}" style="text-decoration: underline;color: #000000 !important;">
                  <img src="{{ topLogo || 'https://picsum.photos/163/50?random=2' }}" height="auto" width="163" alt="{{ title }}" style="float: left;display: block;-ms-interpolation-mode: bicubic;">
                </a>
              </td>
            </tr>
            
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>

<!-- Body Logo -->
<table bgcolor="#FFFFFF" border="0" cellpadding="0" cellspacing="0" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="100%">
  <tbody>
    <tr>
      <td align="center" bgcolor="#FFFFFF" style="background-color: #FFFFFF;border-collapse: collapse;" valign="top">
        <table border="0" cellpadding="0" cellspacing="0" class="body" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 640px;max-width: 640px;" width="640">
          <tbody>
            <tr>
              <td align="left" class="tighten" style="border-collapse: collapse;font-size: 1px;line-height: 1px;" valign="top">
                <a href="{{ logoLink || '#' }}" style="text-decoration: underline;color: #000000 !important;">
                  <img src="{{ bottomLogo || 'https://picsum.photos/163/40?random=3' }}" height="auto" width="163" alt="{{ title }}" style="display: block;-ms-interpolation-mode: bicubic;">
                </a>
              </td>
            </tr>
            <tr>
              <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 25px;"> </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
