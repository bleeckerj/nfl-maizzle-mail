<!-- Sponsor Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 25px 20px; background-color: #f8eccf; border-left: 4px solid #6d6b57;">
      
      <!-- Sponsor Label -->
      <p style="font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; color: #6d6b57; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px;">
        Sponsored
      </p>
      
      <!-- Sponsor Content -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="vertical-align: top; padding-right: 20px;">
            <!-- Sponsor Image -->
            <img src="{{ sponsorImage }}" alt="{{ sponsorTitle }}" width="120" style="width: 120px; height: auto; display: block; border-radius: 4px;">
          </td>
          <td style="vertical-align: top;">
            <!-- Sponsor Title -->
            <h3 style="font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; color: #000000; margin: 0 0 10px 0;">
              <a href="{{ sponsorLink }}" style="color: #000000; text-decoration: none;">{{ sponsorTitle }}</a>
            </h3>
            
            <!-- Sponsor Description -->
            <p style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #333333; margin: 0 0 15px 0;">
              {{ sponsorDescription }}
            </p>
            
            <!-- Sponsor CTA -->
            <a href="{{ sponsorLink }}" style="color: #6d6b57; text-decoration: underline; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;">
              Learn More →
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
