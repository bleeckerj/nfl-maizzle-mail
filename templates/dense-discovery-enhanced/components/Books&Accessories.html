<!-- Books&Accessories Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 30px 20px; background-color: #d1eaf4; border-left: 4px solid #6b9db5;">
      <h2 style="font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; color: #000000; margin: 0 0 20px 0;">
        📚 Books & Accessories
      </h2>
      
      <!-- Books and Accessories Items -->
      <each loop="book in books">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 25px;">
          <tr>
            <td style="vertical-align: top; padding-right: 20px; width: 100px;">
              <img src="{{ book.bookImage || 'https://picsum.photos/80/120?random=5' }}" 
                   alt="{{ book.bookName || 'Featured Book' }}" 
                   width="80" 
                   style="width: 80px; height: auto; display: block; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
            </td>
            <td style="vertical-align: top;">
              <h3 style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; color: #000000; margin: 0 0 8px 0;">
                <a href="{{ book.bookLink || 'https://example.com/book' }}" style="color: #000000; text-decoration: underline;">
                  {{ book.bookName || 'Featured Book Title' }}
                </a>
              </h3>
              <p style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #333333; margin: 0;">
                {{ book.bookDescription || 'An engaging description of this recommended book or accessory.' }}
              </p>
            </td>
          </tr>
        </table>
      </each>
      
      <!-- More Books Link -->
      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ moreItemsLink || 'https://example.com/books' }}" 
           style="color: #6b9db5; text-decoration: underline; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;">
          View All Books & Accessories →
        </a>
      </div>
    </td>
  </tr>
</table>
