<!-- Intro Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 30px 20px; background-color: #ffffff;">
      <h2 style="font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; color: #000000; margin: 0 0 15px 0;">
        Issue {{ issueNumber }} Introduction
      </h2>
      
      <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #333333; margin: 0 0 20px 0;">
        {{ introText }}
      </p>
      
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="border-radius: 4px; background-color: #000000;">
            <a href="{{ articleLink }}" style="display: inline-block; padding: 12px 24px; background-color: #000000; color: #ffffff; text-decoration: none; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; border-radius: 4px;">
              Read Full Article →
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
