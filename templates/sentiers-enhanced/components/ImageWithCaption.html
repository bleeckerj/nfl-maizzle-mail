<!-- ImageWithCaption Component -->
<!-- Purpose: Displays an image with a caption -->
<!-- Variables: imageUrl, captionText, captionLink -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="imagewithcaption">
        <p>{{ imageUrl }}</p>
        <p>{{ captionText }}</p>
        <p>{{ captionLink }}</p>
      </div>
    </td>
  </tr>
</table>
