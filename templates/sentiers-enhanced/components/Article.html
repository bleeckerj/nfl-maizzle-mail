<!-- Article Component -->
<!-- Purpose: Displays an article with title, content, and link -->
<!-- Variables: articleTitle, articleContent, articleLink -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="article">
        <p>{{ articleTitle }}</p>
        <p>{{ articleContent }}</p>
        <p>{{ articleLink }}</p>
      </div>
    </td>
  </tr>
</table>
