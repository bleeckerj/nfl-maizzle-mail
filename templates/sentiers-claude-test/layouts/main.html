<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="x-ua-compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i&display=swap" rel="stylesheet">
  <title>{{ page.title || 'Newsletter' }}</title>
  <style type="text/css">
    {{{ page.css }}}
  </style>
</head>
<body style="background-color: #fff;padding: 0 0 40px;font-family: 'Helvetica',sans-serif;font-weight: 400;line-height: 1.6em;text-align: center;color: #465546;">
  <div itemscope itemtype="http://schema.org/EmailMessage">
    <div itemprop="publisher" itemscope itemtype="http://schema.org/Organization">
      <meta itemprop="name" content="{{ page.publisher_name || 'Newsletter' }}">
      <link itemprop="url" content="{{ page.publisher_url }}">
    </div>
  </div>
  <span class="mcnPreviewText" style="display:none; font-size:0px; line-height:0px; max-height:0px; max-width:0px; opacity:0; overflow:hidden; visibility:hidden; mso-hide:all;">{{ page.preview_text }}</span>
  <div id="content" style="padding: 0;margin: 0 auto;max-width: 600px;text-align: left;">
    <p style="margin-bottom: 60px;text-align: right;font-size: 12px;line-height: 1.6em;" class="viewin">
      <a href="{{ page.view_online_url }}" style="text-decoration: underline;color: #999;">View in browser or share</a>
    </p>
    <block name="template"></block>
  </div>
</body>
</html>
