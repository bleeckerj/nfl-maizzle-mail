<!-- Article Component -->
<!-- Main article content with title, commentary, and optional quotes -->
<!-- Variables: title, url, commentary, quotes -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 20px;">
      <h2 style="font-family: &quot;Lora&quot;,serif;margin: 0;padding: 48px 0 0;font-size: 36px;line-height: 1.2em;font-weight: 400;"><a href="{{ url }}" style="color: #DC4B4B;text-decoration: none;">{{ title }}</a></h2>
<p style="font-size: 18px;line-height: 1.6em;">{{{ commentary }}}</p>
<if condition="quotes && quotes.length">
  <blockquote style="margin: 40px 0;padding: 0 0 0 20px;border-left: 1px solid #B7E2D8;">
    <each loop="quote in quotes">
      <p style="font-size: 17px;line-height: 1.6em;font-family: &quot;Lora&quot;,serif;">
        <if condition="quote.highlight">
          <span class="highlight" style="background: #B7E2D8;">{{ quote.text }}</span>
        </if>
        <if condition="!quote.highlight">
          {{ quote.text }}
        </if>
      </p>
    </each>
  </blockquote>
</if>
    </td>
  </tr>
</table>
