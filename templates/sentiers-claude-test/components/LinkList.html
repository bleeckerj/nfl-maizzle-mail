<!-- LinkList Component -->
<!-- Collection of links with brief descriptions -->
<!-- Variables: section_title, links -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 20px;">
      <h2 style="font-family: &quot;Lora&quot;,serif;margin: 0;padding: 48px 0 0;font-size: 36px;line-height: 1.2em;font-weight: 400;">{{ section_title }}</h2>
<ul class="miscellany" style="font-size: 18px;margin: 24px 0 0;padding: 0;">
  <each loop="link in links">
    <li style="margin: 0;padding: 12px 0;list-style: none;border-top: 1px solid #B7E2D8;line-height: 1.4em;">
      <if condition="link.emoji">{{ link.emoji }} </if>
      <a href="{{ link.url }}" style="color: #DC4B4B;text-decoration: none;">{{ link.title }}</a>. 
      <if condition="link.description">
        <i>{{{ link.description }}}</i>
      </if>
    </li>
  </each>
</ul>
    </td>
  </tr>
</table>
