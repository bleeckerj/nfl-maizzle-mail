<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
  <!--[if gte mso 9]><xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG></o:AllowPNG>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml><![endif]-->

  <!--[if gt mso 15]>
    <style type="text/css" media="all">
      /* Outlook 2016 Height Fix */
      table, tr, td {border-collapse: collapse;}
      tr { font-size:0px; line-height:0px; border-collapse: collapse; }
    </style>
  <![endif]-->

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="date=no">
  <meta name="format-detection" content="telephone=no">
  <if condition="darkModePolicy && darkModePolicy.flatten">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  </if>
  <title>{{{ page.title }}}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Geist:wght@100..900&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Share+Tech+Mono&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Workbench:SCAN@5&display=swap" rel="stylesheet">

  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
      font-family: -apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size: 18px;
      line-height: 27px;
    }

    p,
    .body-copy,
    .large {
      font-size: 19px;
      line-height: 27px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .note-content,
    .note-content p,
    .note-content span,
    .note-content a,
    .note-content code {
      font-size: 14px;
      line-height: 19px;
      font-weight: 400;
      color: #707070;
      font-style: italic;
    }

    .note-content p {
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 21px;
      line-height: 29px;
      margin-top: 0;
      margin-bottom: 12px;
    }

    @media screen and (max-width:599px) {
      .force-row, .container, .header, .body, .footer {
        width: 100% !important;
        max-width: 100% !important;
        font-family: "Ubuntu", sans-serif;
        font-style: normal;
      }
      .padl20 { padding-left: 12px !important }
      .padr20 { padding-right: 12px !important }
      .padl10 { padding-left: 12px !important }
      .padr10 { padding-right: 12px !important }
      .padt20 { padding-top: 12px !important }
      .mobt0 { padding-top: 0 !important }
      .mobb15 { margin-bottom: 15px !important }
      .headline { padding-left: 12px !important; padding-right: 12px !important; }
      h1 { font-size: 21px !important; line-height: 29px !important; }
      .spacer { padding-top: 15px !important; }
      .browser { display: none !important; }
      .align-left { text-align: left }
      .h1byline { line-height: 22px !important; padding-top: 6px; font-size: 19px !important; }
      
      /* Make section content images full-width on mobile, but not logos */
      .force-row img {
        width: 100% !important; 
        max-width: 100% !important;
        height: auto !important;
        margin-bottom: 15px !important;
      }

      /* MOBILE FONT SIZE LOCK:
         Keep dense-discovery body copy larger on mobile. This intentionally
         overrides inline font sizes in email clients. Do not remove, lower, or
         narrow these selectors unless the operator explicitly requests that
         change and updates mobile-font-size-lock.test.mjs with the new rule. */
      .mob-text,
      .mob-text a,
      .mob-text p,
      .mob-text li,
      .intro-content,
      .intro-content a,
      .intro-content p,
      .intro-content li,
      .intro-aside,
      .intro-aside a,
      .intro-aside p,
      .intro-aside li {
        font-size: 23px !important;
        line-height: 1.3 !important;
      }

      .mob-title {
        font-size: 26px !important;
        line-height: 1.3 !important;
      }

      .mob-subtitle {
        font-size: 23px !important;
        line-height: 1.3 !important;
      }

      .mob-readmore,
      .mob-readmore a {
        font-size: 23px !important;
        line-height: 1.3 !important;
      }

      .mob-caption,
      .mob-caption p,
      .mob-caption span,
      .mob-caption li,
      .mob-caption .mob-text {
        font-size: 14px !important;
        line-height: 1.2 !important;
      }

      .mob-meta,
      .mob-meta span,
      .mob-meta a {
        font-size: 16px !important;
        line-height: 1.1 !important;
      }

      .mob-title a,
      .mob-subtitle a,
      .mob-text a,
      .intro-content a,
      .intro-aside a,
      .mob-readmore a,
      .mob-caption a,
      .mob-caption strong,
      .mob-caption em {
        font-size: inherit !important;
        line-height: inherit !important;
      }

      h1 a,
      h2 a,
      h3 a {
        font-size: inherit !important;
        line-height: inherit !important;
      }

      .mob-title .mob-meta,
      .mob-title .mob-meta span,
      .mob-title .mob-meta a {
        font-size: 16px !important;
        line-height: 1.1 !important;
      }
    }
    
    .ios-footer a { color: {{ themeColors.linkAccent || '#aaaaaa' }} !important; text-decoration: underline; }
    .yshortcuts a { border-bottom: none !important; }
    .ExternalClass { width: 100%; }
    .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }
    .ReadMsgBody { width: 100%; background-color: #ebebeb; }
    img { -ms-interpolation-mode: bicubic; }
    a[href^="x-apple-data-detectors:"], a[x-apple-data-detectors] {
      color: inherit !important; text-decoration: none !important;
      font-size: inherit !important; font-family: inherit !important;
      font-weight: inherit !important; line-height: inherit !important;
    }

    /* Theme-based link colors */
    a {
      color: {{ themeColors.linkAccent || '#006afa' }} !important;
    }
    
    /* Specific link color overrides for different contexts */
    .link-primary {
      color: {{ themeColors.linkAccent || '#006afa' }} !important;
    }
    
    .link-secondary {
      color: {{ themeColors.accent || '#4a7c59' }} !important;
    }


    .workbench {
      font-family: "Workbench", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "BLED" 0,
        "SCAN" 5;
    }

    .share-tech-mono-regular {
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      font-style: normal;
    }

    .ibm-plex-sans {
      font-family: "IBM Plex Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    .ubuntu-light {
      font-family: "Ubuntu", sans-serif;
      font-weight: 300;
      font-style: normal;
    }

    .ubuntu-regular {
      font-family: "Ubuntu", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .ubuntu-medium {
      font-family: "Ubuntu", sans-serif;
      font-weight: 500;
      font-style: normal;
    }

    .ubuntu-bold {
      font-family: "Ubuntu", sans-serif;
      font-weight: 700;
      font-style: normal;
    }

    .ubuntu-light-italic {
      font-family: "Ubuntu", sans-serif;
      font-weight: 300;
      font-style: italic;
    }

    .ubuntu-regular-italic {
      font-family: "Ubuntu", sans-serif;
      font-weight: 400;
      font-style: italic;
    }

    .ubuntu-medium-italic {
      font-family: "Ubuntu", sans-serif;
      font-weight: 500;
      font-style: italic;
    }

    .ubuntu-bold-italic {
      font-family: "Ubuntu", sans-serif;
      font-weight: 700;
      font-style: italic;
    }

    .intro-content p {
      margin: 0;
      padding: 0;
      margin-bottom: 15px;
    }

    .intro-content img {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 0 0 15px 0;
    }

    .image-caption {
      margin: 8px 0 12px 0;
      padding: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 500;
      color: #495263;
      text-align: left;
      text-decoration: none !important;
    }

    .image-credit {
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.45;
      font-weight: 400;
      color: #7a859a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none !important;
    }

    /* Dynamic theme colors */
    .theme-link {
      color: {{{ page.theme.linkAccent || '#0066cc' }}};
    }

	  </style>

	  <if condition="darkModePolicy && darkModePolicy.flatten">
	  <style type="text/css">
	    @media (prefers-color-scheme: dark) {
	      body.dm-bg,
	      .dm-bg {
	        background-color: #111318 !important;
	      }

	      .dm-bg table,
	      .dm-bg td,
	      .dm-surface {
	        background-color: #1b1f27 !important;
	      }

	      .dm-text,
	      .dm-bg,
	      .dm-bg p,
	      .dm-bg div,
	      .dm-bg span,
	      .dm-bg h1,
	      .dm-bg h2,
	      .dm-bg h3,
	      .dm-bg h4,
	      .dm-bg h5,
	      .dm-bg h6 {
	        color: #f2f4f8 !important;
	      }

	      .dm-muted,
	      .dm-bg .mob-meta,
	      .dm-bg .image-caption,
	      .dm-bg .image-credit {
	        color: #b8c0cc !important;
	      }

	      .dm-link,
	      .dm-bg a,
	      .dm-bg .theme-link {
	        color: #8ecbff !important;
	      }

	      .dm-border,
	      .dm-bg .headline,
	      .dm-bg table,
	      .dm-bg td {
	        border-color: #343b48 !important;
	      }
	    }
	  </style>
	  </if>

	  <if condition="page.dynamicCSS">
  <style type="text/css">
    {{{ page.dynamicCSS }}}
  </style>
  </if>

  <!--[if mso]>
    <style type="text/css">
      body, table, td, h1, h2, h3, p {font-family: Arial, sans-serif !important;}
    </style>
  <![endif]-->
</head>
<body class="{{ darkModePolicy && darkModePolicy.flatten ? 'dm-bg dm-text' : '' }}" bgcolor="#FFFFFF" style="margin: 0;padding: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;font-family: -apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size: 18px;line-height: 27px;">

  <table class="{{ darkModePolicy && darkModePolicy.flatten ? 'dm-bg dm-text' : '' }}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;">
    <tr>
      <td class="{{ darkModePolicy && darkModePolicy.flatten ? 'dm-bg dm-text' : '' }}" align="center" style="padding:0; margin:0;">
        <!-- Fluid inner table keeps Gmail from zooming the canvas -->
        <table class="{{ darkModePolicy && darkModePolicy.flatten ? 'dm-surface dm-text' : '' }}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt; width:100%; max-width:640px; font-family:'Ubuntu',sans-serif; font-style:normal; font-weight:400;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;">
          <tr>
            <td style="padding:0; margin:0;">
              <!-- Your email content starts here -->

              <block name="template"></block>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
