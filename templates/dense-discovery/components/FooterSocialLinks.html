<!-- Shared Icons8 account strip; links and titles come from footer.socialLinks. -->
<table role="presentation" class="footer-social-links" border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto; border-spacing: 0;">
<tr>
  <!-- GitHub Links -->
  <each loop="link in footer.socialLinks.github">
  <td style="padding: 0 6px;">
    <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'GitHub' }}">
    <img class="{{ darkModePolicy && darkModePolicy.flatten ? 'dm-footer-artwork' : '' }}" src="https://img.icons8.com/ios-glyphs/24/000000/github.png" alt="{{ link.title || 'GitHub' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;">
    </a>
  </td>
  </each>
