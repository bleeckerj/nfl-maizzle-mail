<!-- FOOTER -->
<table bgcolor="#f2f2f2" border="0" cellpadding="0" cellspacing="0" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="100%">
  <tbody>
    <tr>
      <td align="center" bgcolor="#f2f2f2" style="background-color: #f2f2f2;border-collapse: collapse;" valign="top">
        <!-- 640px container -->
        <table border="0" cellpadding="0" cellspacing="0" class="footer" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 640px;max-width: 640px;" width="640">
          <tbody>
            <tr>
              <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 25px;"> </td>
            </tr>
            <tr>
              <td align="left" class="padt20 padr20 padl20" style="text-align: center;border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-left: 20px;" valign="top">
                <h1 class="padb15" style="mso-line-height-rule: exactly;font-size: 21px;font-weight: 600;line-height: 23px;color: #000000;margin: 0;padding: 0;padding-bottom: 15px;">
                  Enjoyed this issue? Share it:
                </h1>
                <if condition="footer.shareUrl">
                  <p class="share" style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 15px 5px;margin: 0;margin-bottom: 15px;border: 1px dashed #5f5f5f;background: #f8f8f8;text-align: center;">
                    <a href="{{ footer.shareUrl }}" style="text-decoration: underline;color: #000000 !important;">
                      <strong style="font-weight: 600;">{{ footer.shareUrl }}</strong>
                    </a>
                  </p>
                </if>
                <if condition="footer.twitterShare">
                  <a class="small" href="{{ footer.twitterShare }}" style="text-decoration: underline;font-size: 14px;line-height: 19px;color: #000000 !important;">Share on Twitter</a> →   
                </if>
                <if condition="footer.emailShare">
                  <a class="small" href="{{ footer.emailShare }}" style="text-decoration: underline;font-size: 14px;line-height: 19px;color: #000000 !important;">Forward via email</a> →
                </if>
              </td>
            </tr>
            <tr>
              <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 25px;"> </td>
            </tr>
            <!-- Footer Logo -->
            <if condition="footer.logo">
              <tr>
                <td align="center" class="padt20 padr20 padl20" style="border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-left: 20px;text-align: center;" valign="top">
                  <a href="{{ footer.logoLink || '#' }}" style="text-decoration: none;">
                    <img src="{{ footer.logo }}" alt="Footer Logo" width="120" height="auto" style="-ms-interpolation-mode: bicubic;display: block;margin: 0 auto;">
                  </a>
                </td>
              </tr>
              <tr>
                <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 15px;"> </td>
              </tr>
            </if>

            <!-- Social Media Links -->
            <if condition="footer.socialLinks">
              <tr>
                <td align="center" class="padt20 padr20 padl20" style="border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-left: 20px;text-align: center;" valign="top">
                  <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto; border-spacing: 0;">
                    <tr>
                      <!-- GitHub Links -->
                      <each loop="link in footer.socialLinks.github">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'GitHub' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="{{ link.title || 'GitHub' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                      
                      <!-- Instagram Links -->
                      <each loop="link in footer.socialLinks.instagram">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'Instagram' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="{{ link.title || 'Instagram' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                      
                      <!-- YouTube Links -->
                      <each loop="link in footer.socialLinks.youtube">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'YouTube' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="{{ link.title || 'YouTube' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                      
                      <!-- Discord Links -->
                      <each loop="link in footer.socialLinks.discord">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'Discord' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="{{ link.title || 'Discord' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                      
                      <!-- Patreon Links -->
                      <each loop="link in footer.socialLinks.patreon">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'Patreon' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/patreon.svg" alt="{{ link.title || 'Patreon' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                      
                      <!-- Substack Links -->
                      <each loop="link in footer.socialLinks.substack">
                        <td style="padding: 0 6px;">
                          <a href="{{ link.url }}" style="text-decoration: none;" title="{{ link.title || 'Substack' }}">
                            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/substack.svg" alt="{{ link.title || 'Substack' }}" width="24" height="24" style="-ms-interpolation-mode: bicubic;display: block;filter: brightness(0);">
                          </a>
                        </td>
                      </each>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 15px;"> </td>
              </tr>
            </if>

            <!-- Footer Links and Address -->
            <tr>
              <td align="left" class="padt20 padr20 padl20" style="border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-left: 20px;" valign="top">
                <p style="font-size: 16px;line-height: 23px;font-weight: 400;color: #000000;padding: 0;margin: 0;margin-bottom: 15px;">
                  <if condition="footer.unsubscribeLink">
                    <a href="{{ footer.unsubscribeLink }}" style="text-decoration: underline;color: #000000 !important;">Unsubscribe</a><br>
                  </if>
                  <if condition="footer.archiveLink">
                    <a href="{{ footer.archiveLink }}" style="text-decoration: underline;color: #000000 !important;">Browse older issues</a><br>
                  </if>
                </p>
                <if condition="footer.address">
                  <p class="small grey" style="font-size: 14px;line-height: 19px;font-weight: 400;color: #707070 !important;padding: 0;margin: 0;margin-bottom: 15px;">
                    {{{ footer.address }}}
                  </p>
                </if>
              </td>
            </tr>

            <!-- Colophon/Final Word -->
            <if condition="footer.colophon">
              <tr>
                <td align="center" class="padt10 padr20 padl20" style="border-collapse: collapse;padding-top: 10px;padding-right: 20px;padding-left: 20px;text-align: center;" valign="top">
                  <p class="small grey" style="font-size: 12px;line-height: 16px;font-weight: 400;color: #999999;padding: 0;margin: 0;font-style: italic;">
                    {{{ footer.colophon }}}
                  </p>
                </td>
              </tr>
            </if>
            <tr>
              <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 25px;"> </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
