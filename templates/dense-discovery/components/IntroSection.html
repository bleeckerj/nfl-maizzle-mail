<!-- INTRO Start -->
<tr>
  <td align="left" style="border-collapse: collapse;">
    <!--[if mso]>
      <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr><td width="50%" valign="top"><![endif]-->
    
    <!-- Welcome Title -->
    <table align="left" border="0" cellpadding="0" cellspacing="0" class="force-row" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;" width="320">
      <tbody>
        <tr>
          <td class="padt15 padr10 padl20" style="border-collapse: collapse;padding-top: 15px;padding-right: 10px;padding-left: 20px;" valign="top">
            <if condition="intro.title">
              <h1 style="mso-line-height-rule: exactly;font-size: 21px;font-weight: 600;line-height: 23px;color: #000000;margin: 0;padding: 0;">
                {{ intro.title }}
              </h1>
            </if>
          </td>
        </tr>
      </tbody>
    </table>

    <!--[if mso]></td><td width="50%" valign="top" class="browser"><![endif]-->
    
    <!-- View Online Link -->
    <table align="right" border="0" cellpadding="0" cellspacing="0" class="force-row browser" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;text-align: right;" width="320">
      <tbody>
        <tr>
          <td class="padt15 padr20 padl10" style="border-collapse: collapse;padding-top: 15px;padding-right: 20px;padding-left: 10px;" valign="top">
            <p class="small grey" style="font-size: 14px;line-height: 19px;font-weight: 400;color: #707070 !important;padding: 0;margin: 0;margin-bottom: 15px;">
              <a class="grey" href="{{ intro.viewOnlineLink || '#' }}" style="text-decoration: underline;color: #707070 !important;">View/share online</a> →
            </p>
          </td>
        </tr>
      </tbody>
    </table>

    <!--[if mso]></td></tr></table><![endif]-->
  </td>
</tr>

<!-- Intro Content -->
<if condition="intro.content">
  <tr>
    <td align="left" class="ibm-plex-sans padt20 padl20 padr20 padb10" style="font-family: 'Ubuntu', sans-serif;border-collapse: collapse;padding-top: 20px;padding-right: 20px;padding-bottom: 10px;padding-left: 20px;">
      <div class="intro-content" style="font-family: 'Ubuntu', sans-serif; font-size: 21px;line-height: 30px;font-weight: 400;color: #000000;">
        <style>
          .intro-content p {
            font-family: 'Ubuntu', sans-serif !important;
            font-size: 16px !important;
            line-height: 19px !important;
            font-weight: 400 !important;
            color: #000000 !important;
            margin: 0 !important;
            padding: 0 !important;
            margin-bottom: 15px !important;
          }
        </style>
        {{{ intro.content }}}
      </div>
    </td>
  </tr>
</if>
<!-- INTRO End -->
