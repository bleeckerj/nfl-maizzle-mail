<!-- INTRO Start -->
<tr>
  <td align="left" style="border-collapse: collapse;">
    <!--[if mso]>
      <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr><td width="50%" valign="top"><![endif]-->
    
    <!-- Full-width Quote Above Title -->
    <if condition="intro.quote">
      <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tbody>
          <tr>
            <td style="border-collapse: collapse;padding: 0 20px 0 20px;">
              <blockquote style="font-family: 'Merriweather', serif; font-size: 18px;line-height: 25px;font-weight: 400;color: #555;font-style: italic;margin: 0 0 18px 0;padding: 0 0 0 12px;border-left: 3px solid rgb(82, 100, 222);">
                {{ intro.quote }}
              </blockquote>
            </td>
          </tr>
        </tbody>
      </table>
    </if>

    <!-- Welcome Title -->
    <table align="left" border="0" cellpadding="0" cellspacing="0" class="force-row" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 100%;max-width: 320px;" width="320">
      <tbody>
        <tr>
          <td class="padt15 padr10 padl20" style="border-collapse: collapse;padding-top: 15px;padding-right: 10px;padding-left: 20px;" valign="top">
            <if condition="intro.title">
              <h1 style="mso-line-height-rule: exactly;font-size: 21px;font-weight: 600;line-height: 23px;color: #000000;margin: 0;padding: 0;">
                {{ intro.title }}
              </h1>
            </if>
          </td>
        </tr>
      </tbody>
    </table>

    <!--[if mso]></td><td width="50%" valign="top" class="browser"><![endif]-->
    
    <!-- View Online Link -->
    <table align="right" border="0" cellpadding="0" cellspacing="0" class="force-row browser" style="border-spacing: 0;mso-table-lspace: 0pt;mso-table-rspace: 0pt;text-align: right;width: 100%;max-width: 320px;" width="320">
      <tbody>
        <tr>
          <td class="padt15 padr20 padl10" style="border-collapse: collapse;padding-top: 15px;padding-right: 20px;padding-left: 10px;" valign="top">
            <p class="small grey" style="font-size: 14px;line-height: 19px;font-weight: 400;color: #707070 !important;padding: 0;margin: 0;margin-bottom: 15px;">
              <a class="grey" href="{{ intro.viewOnlineLink || '#' }}" style="text-decoration: underline;color: #707070 !important;">View/share online</a> →
            </p>
          </td>
        </tr>
      </tbody>
    </table>

    <!--[if mso]></td></tr></table><![endif]-->
  </td>
</tr>

<!-- Intro Image(s) (optional) -->
<if condition="intro.images && intro.images.length">
  <each loop="image in intro.images">
    <tr>
      <td align="center" class="padt20 padl20 padr20" style="border-collapse: collapse;padding-top: 20px;padding-left: 20px;padding-right: 20px;">
        <if condition="(typeof image === 'object' && image !== null && image.hasOwnProperty('link')) || intro.imageLink">
          <a href="{{ (typeof image === 'object' && image !== null && image.hasOwnProperty('link')) ? image.link : intro.imageLink }}" target="_blank">
            <img src="{{ (typeof image === 'object' && image !== null && image.hasOwnProperty('src')) ? image.src : image }}" alt="{{ (typeof image === 'object' && image !== null && image.hasOwnProperty('alt')) ? image.alt : (intro.imageAlt || intro.title || 'Intro image') }}" width="600" style="-ms-interpolation-mode: bicubic;border-radius: 10px;display: block;width: 100%;max-width: 600px;height: auto;border: 0;">
          </a>
        </if>
        <if condition="!((typeof image === 'object' && image !== null && image.hasOwnProperty('link')) || intro.imageLink)">
          <img src="{{ (typeof image === 'object' && image !== null && image.hasOwnProperty('src')) ? image.src : image }}" alt="{{ (typeof image === 'object' && image !== null && image.hasOwnProperty('alt')) ? image.alt : (intro.imageAlt || intro.title || 'Intro image') }}" width="600" style="-ms-interpolation-mode: bicubic;border-radius: 10px;display: block;width: 100%;max-width: 600px;height: auto;border: 0;">
        </if>
        <if condition="typeof image === 'object' && image !== null && image.hasOwnProperty('caption') && image.caption">
          <p class="image-caption mob-caption" style="margin: 8px 0 12px 0;padding: 0;font-family: 'IBM Plex Sans', sans-serif;font-size: 14px;line-height: 1.2;font-weight: 500;color: #495263;text-align: left;text-decoration: none !important;">{{{ image.caption }}}</p>
        </if>
      </td>
    </tr>
  </each>
</if>

<if condition="(!intro.images || !intro.images.length) && intro.image">
  <tr>
    <td align="center" class="padt20 padl20 padr20" style="border-collapse: collapse;padding-top: 20px;padding-left: 20px;padding-right: 20px;">
      <if condition="(typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('link')) || intro.imageLink">
        <a href="{{ (typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('link')) ? intro.image.link : intro.imageLink }}" target="_blank">
          <img src="{{ (typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('src')) ? intro.image.src : intro.image }}" alt="{{ (typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('alt')) ? intro.image.alt : (intro.imageAlt || intro.title || 'Intro image') }}" width="600" style="-ms-interpolation-mode: bicubic;border-radius: 10px;display: block;width: 100%;max-width: 600px;height: auto;border: 0;">
        </a>
      </if>
      <if condition="!((typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('link')) || intro.imageLink)">
        <img src="{{ (typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('src')) ? intro.image.src : intro.image }}" alt="{{ (typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('alt')) ? intro.image.alt : (intro.imageAlt || intro.title || 'Intro image') }}" width="600" style="-ms-interpolation-mode: bicubic;border-radius: 10px;display: block;width: 100%;max-width: 600px;height: auto;border: 0;">
      </if>
      <if condition="typeof intro.image === 'object' && intro.image !== null && intro.image.hasOwnProperty('caption') && intro.image.caption">
        <p class="image-caption mob-caption" style="margin: 8px 0 12px 0;padding: 0;font-family: 'IBM Plex Sans', sans-serif;font-size: 14px;line-height: 1.2;font-weight: 500;color: #495263;text-align: left;text-decoration: none !important;">{{{ intro.image.caption }}}</p>
      </if>
    </td>
  </tr>
</if>

<!-- Intro Aside (optional) -->
<if condition="intro.aside">
  <tr>
  <td class="spacer" style="border-collapse: collapse;font-size: 1px;line-height: 1;padding-top: 20px;"> </td>
  </tr>
  <tr>
    <td align="left" class="padl20 padr20 padb10" style="border-collapse: collapse;padding-right: 20px;padding-bottom: 10px;padding-left: 20px; margin-top: 30px;">
      <div class="intro-aside" style="font-family: {{ intro.aside.contentStyles.fontFamily || '\'Ubuntu\', sans-serif' }}; font-size: {{ intro.aside.contentStyles.fontSize || '18px' }};line-height: {{ intro.aside.contentStyles.lineHeight || '23px' }};font-weight: {{ intro.aside.contentStyles.fontWeight || '400' }};font-style: {{ intro.aside.contentStyles.fontStyle || 'italic' }}; color: {{ intro.aside.contentStyles.color || '#3f3f3f' }};text-align: {{ intro.aside.contentStyles.textAlign || 'left' }}; background-color: {{ intro.aside.containerStyles.backgroundColor || themeColors.introAside || '#f8fff4' }};border-left: {{ intro.aside.containerStyles.borderLeftWidth || '5px' }} {{ intro.aside.containerStyles.borderLeftStyle || 'solid' }} {{ intro.aside.containerStyles.borderLeftColor || '#d7d1c6' }};padding: {{ intro.aside.containerStyles.padding || '12px 14px' }};border-radius: {{ intro.aside.containerStyles.borderRadius || '6px' }};">
        {{{ intro.aside.content || intro.aside }}}
      </div>
    </td>
  </tr>
</if>

<!-- Intro Content -->
<if condition="intro.content">
  <tr>
    <td align="left" class="padl20 padr20" style="border-collapse: collapse;padding-right: 20px;padding-left: 20px;">
      <div class="intro-content" style="font-family: {{ intro.contentStyles.fontFamily || '\'IBM Plex Sans\', sans-serif' }}; font-size: {{ intro.contentStyles.fontSize || '16px' }};line-height: {{ intro.contentStyles.lineHeight || '1.2rem' }};font-weight: {{ intro.contentStyles.fontWeight || '400' }};color: {{ intro.contentStyles.color || '#000000' }};text-align: {{ intro.contentStyles.textAlign || 'left' }};background-color: {{ intro.containerStyles.backgroundColor || 'transparent' }};padding: {{ intro.containerStyles.padding || '0' }};border-radius: {{ intro.containerStyles.borderRadius || '0px' }};">
        {{{ intro.content }}}
      </div>
    </td>
  </tr>
</if>
<!-- INTRO End -->
