<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no">
  <meta name="format-detection" content="date=no">
  <title>{{{ page.title }}}</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    a {
      text-decoration: underline;
    }

    .correspondence-shell {
      width: 100%;
      max-width: 640px;
    }

    .correspondence-card {
      border: 0;
      padding: 36px 0 32px 0;
    }

    .correspondence-subject {
      font-size: 26px;
      line-height: 33px;
      font-weight: normal;
      margin: 0 0 24px 0;
    }

    .correspondence-from {
      border-left: 3px solid;
      font-size: 13px;
      line-height: 18px;
      margin: 0 0 24px 0;
      padding: 0 0 0 12px;
    }

    .correspondence-body {
      font-size: 16px;
      line-height: 25px;
    }

    .correspondence-p {
      margin: 0 0 16px 0;
      padding: 0;
    }

    .correspondence-heading {
      font-weight: normal;
      margin: 26px 0 12px 0;
      padding: 0;
    }

    .correspondence-heading-2 {
      font-size: 22px;
      line-height: 28px;
    }

    .correspondence-heading-3,
    .correspondence-heading-4 {
      font-size: 18px;
      line-height: 24px;
    }

    .correspondence-list {
      margin: 0 0 18px 22px;
      padding: 0;
    }

    .correspondence-li {
      margin: 0 0 8px 0;
      padding: 0;
    }

    .correspondence-link {
      text-decoration: underline;
    }

    .correspondence-quote {
      border-left: 3px solid;
      font-size: 17px;
      line-height: 25px;
      margin: 20px 0;
      padding: 0 0 0 14px;
    }

    .correspondence-quote p {
      margin: 0;
      padding: 0;
    }

    .correspondence-rule {
      border: 0;
      border-top: 1px solid;
      margin: 24px 0;
    }

    .correspondence-code {
      background: #f1f3f5;
      border: 1px solid #d8dde3;
      border-radius: 3px;
      font-family: Courier, "Courier New", monospace;
      font-size: 14px;
      padding: 1px 4px;
    }

    .correspondence-signature {
      font-size: 15px;
      line-height: 22px;
      margin: 24px 0 0 0;
    }

    .correspondence-signature-name {
      font-weight: normal;
      margin: 0;
    }

    .correspondence-signature-lines {
      margin: 24px 0 0 0;
    }

    .correspondence-signature-line {
      margin: 0 0 3px 0;
    }

    .correspondence-shared {
      border-top: 1px solid;
      margin: 28px 0 0 0;
      padding: 24px 0 0 0;
    }

    .correspondence-shared-heading {
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0;
      margin: 0 0 14px 0;
      text-transform: uppercase;
    }

    .correspondence-shared-table {
      table-layout: fixed;
      width: 100%;
    }

    .correspondence-shared-cell {
      padding: 0 24px 22px 0;
      vertical-align: top;
      width: 50%;
    }

    .correspondence-shared-item,
    .correspondence-shared-item-cell {
      max-width: 260px;
      width: 260px;
    }

    .correspondence-shared-item-cell {
      text-align: left;
    }

    .correspondence-shared-kicker {
      font-size: 11px;
      line-height: 15px;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }

    .correspondence-shared-image-link {
      display: block;
      margin: 0 0 10px 0;
      text-decoration: none;
    }

    .correspondence-shared-image {
      border: 0;
      display: block;
      height: auto;
      margin: 0;
      max-width: 260px;
      outline: none;
      text-decoration: none;
      width: 100%;
    }

    .correspondence-shared-title {
      font-size: 17px;
      line-height: 22px;
      margin: 0 0 6px 0;
    }

    .correspondence-shared-title a {
      text-decoration: underline;
    }

    .correspondence-shared-description {
      font-size: 13px;
      line-height: 19px;
      margin: 0;
      overflow-wrap: break-word;
      word-break: normal;
    }

    .correspondence-footer {
      border-top: 1px solid;
      font-size: 12px;
      line-height: 18px;
      margin: 28px 0 0 0;
      padding: 18px 0 0 0;
    }

    @media screen and (max-width: 680px) {
      .correspondence-shell {
        width: 100% !important;
        max-width: 100% !important;
      }

      .correspondence-pad {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }

      .correspondence-card {
        padding: 26px 0 24px 0 !important;
      }

      .correspondence-body,
      .correspondence-p {
        font-size: 16px !important;
        line-height: 24px !important;
      }

      .correspondence-shared-cell {
        display: block !important;
        width: 100% !important;
        padding-right: 0 !important;
        text-align: center !important;
      }

      .correspondence-shared-item {
        margin-left: auto !important;
        margin-right: auto !important;
      }

      .correspondence-shared-image {
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: {{ correspondence.theme.backgroundColor }};">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: {{ correspondence.theme.backgroundColor }};">
    <tr>
      <td align="center" class="correspondence-pad" style="padding: 28px 20px;">
        <block name="template"></block>
      </td>
    </tr>
  </table>
</body>
</html>
