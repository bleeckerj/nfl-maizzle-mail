<!-- ArticleSection Component -->
<!-- Purpose: Displays articles with images and descriptions -->
<!-- Variables: articles -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="articlesection" style="text-align: center;">
        <h1 style="font-family: Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace; font-weight: 400; font-size: 24px; margin: 20px 0;">
          <strong>{{ collectionTitle }}</strong>
        </h1>
        <img src="{{ mainImage }}" alt="{{ collectionTitle }}" style="display: block; outline: none; text-decoration: none; height: auto; width: 100%; font-size: 13px; max-width: 564px; margin: 0 auto;">
        <p style="font-family: Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace; font-weight: 400; font-size: 14px; margin: 20px 0;">
          {{ collectionDescription }}
        </p>
        <p style="font-family: Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace; font-weight: 400; font-size: 14px; margin: 20px 0;">
          {{ collectionDetails }}
        </p>
        <if condition="markdownContent">
        <div style="font-family: Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace; font-weight: 400; font-size: 14px; margin: 20px 0;">
          {{{ markdownContent }}}
        </div>
        </if>
        <div style="margin: 20px 0;">
          <each loop="image in productImages">
            <img src="{{ image }}" alt="Product" style="display: inline-block; outline: none; text-decoration: none; height: auto; width: 182px; font-size: 13px; margin: 5px;">
          </each>
        </div>
        <p style="font-family: Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace; font-weight: 400; font-size: 14px; margin: 20px 0;">
          Visit <a href="{{ shopLink }}" style="color: #15c; font-weight: normal; text-decoration: none;">wearebraindead.com</a> to shop the full collection.
        </p>
      </div>
    </td>
  </tr>
</table>
