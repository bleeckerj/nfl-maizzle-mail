<script props>
  // Stable indices preserve section identity after nested loops. The canonical
  // builder runs from the renderer root; all templates share this presentation helper.
  (() => {
    const section = props.sections[props.ctaSectionIndex];
    const present = require(require('path').resolve('lib/newsletter-core/inline-cta.cjs'));
    return { section, cta: present(section, 'brain-dead-template') };
  })()
</script>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
        <tr>
          <td class="bd-pad" style="padding:{{ cta.spaceTop }} 32px {{ cta.spaceBottom }} 32px;">
            <table data-content-slot="inline_cta" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background:{{ section.background || '#000000' }};border:{{ cta.borderWidth }} solid {{ section.border_color || '#000000' }};border-radius:{{ cta.borderRadius }};overflow:hidden;">
              <tr>
                <td style="padding:22px 24px 0;">
                  <p class="bd-mono" style="margin:0 0 8px 0;font-family:{{ cta.fontFamily }};font-size:12px;line-height:17px;letter-spacing:0.12em;text-transform:uppercase;color:{{ section.eyebrow_color || '#f2ff3d' }};">{{ section.eyebrow || 'Editorial Note' }}</p>
                  <if condition="section.statement"><div class="bd-copy" style="margin:0;color:{{ section.text_color || '#ffffff' }};font-family:{{ cta.fontFamily }};font-size:16px;line-height:23px;">{{{ cta.statement }}}</div></if>
                </td>
              </tr>
              <tr>
                <td style="padding:16px 24px 10px;">
                  <if condition="section.primaryAction && section.primaryAction.url"><a class="bd-button" href="{{ section.primaryAction.url }}" style="display:inline-block;margin:0 8px 12px 0;background:{{ section.button_background || '#f2ff3d' }};color:{{ section.button_text_color || '#000000' }}!important;-webkit-text-fill-color:{{ section.button_text_color || '#000000' }};font-family:{{ cta.fontFamily }};font-size:12px;line-height:15px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;padding:11px 14px;border:{{ cta.buttonBorderWidth }} solid {{ section.button_border_color || section.button_background || '#f2ff3d' }};">{{ section.primaryAction.label }}</a></if>
                  <if condition="section.secondaryAction && section.secondaryAction.url"><a class="bd-button" href="{{ section.secondaryAction.url }}" style="display:inline-block;margin:0 8px 12px 0;background:{{ section.secondary_button_background || '#ffffff' }};color:{{ section.secondary_button_text_color || '#000000' }}!important;-webkit-text-fill-color:{{ section.secondary_button_text_color || '#000000' }};font-family:{{ cta.fontFamily }};font-size:12px;line-height:15px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;padding:11px 14px;border:{{ cta.secondaryButtonBorderWidth }} solid {{ section.secondary_button_border_color || '#ffffff' }};">{{ section.secondaryAction.label }}</a></if>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
