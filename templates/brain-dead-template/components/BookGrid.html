<!-- BookGrid Component -->
<!-- Purpose: Renders one row per book, optimized for a four-book sales email. -->
<!-- Variables: books[] with title, subtitle, body, image, imageAlt, price, link, ctaText -->

<if condition="books && books.length">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
    <tr>
      <td class="bd-pad" style="padding:12px 32px 8px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-top:2px solid #000000;">
          <tr>
            <td style="padding:16px 0 10px 0;">
              <p class="bd-mono" style="margin:0;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:18px;letter-spacing:0.12em;text-transform:uppercase;color:#000000;">
                {{ booksLabel || 'The four books' }}
              </p>
            </td>
          </tr>
        </table>
        <each loop="book in books">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-top:1px solid #000000;">
            <tr>
              <td class="bd-book-image-cell" valign="top" width="188" style="width:188px;padding:22px 24px 22px 0;">
                <if condition="book.image">
                  <if condition="book.link">
                    <a href="{{ book.link }}" style="text-decoration:none;">
                      <img class="bd-book-image" src="{{ book.image }}" alt="{{ book.imageAlt || book.title }}" width="188" style="width:188px;max-width:188px;height:auto;">
                    </a>
                  </if>
                  <if condition="!book.link">
                    <img class="bd-book-image" src="{{ book.image }}" alt="{{ book.imageAlt || book.title }}" width="188" style="width:188px;max-width:188px;height:auto;">
                  </if>
                </if>
              </td>
              <td class="bd-book-copy-cell" valign="top" style="padding:22px 0;">
                <p class="bd-mono" style="margin:0 0 6px 0;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:16px;letter-spacing:0.1em;text-transform:uppercase;color:#000000;">
                  {{ book.kicker || book.format || 'Book' }}
                </p>
                <h2 class="bd-mono" style="margin:0;font-family:'Courier New',Courier,monospace;font-size:25px;line-height:29px;font-weight:700;letter-spacing:0;color:#000000;">
                  <if condition="book.link">
                    <a href="{{ book.link }}" style="color:#000000;text-decoration:none;">{{ book.title }}</a>
                  </if>
                  <if condition="!book.link">{{ book.title }}</if>
                </h2>
                <if condition="book.subtitle">
                  <p class="bd-book-copy bd-mono" style="margin:8px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:15px;line-height:22px;color:#000000;">
                    {{ book.subtitle }}
                  </p>
                </if>
                <if condition="book.body">
                  <p class="bd-book-copy bd-mono" style="margin:12px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:14px;line-height:21px;color:#000000;">
                    {{{ book.body }}}
                  </p>
                </if>
                <if condition="book.price">
                  <p class="bd-mono" style="margin:14px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:18px;font-weight:700;color:#000000;">
                    {{ book.price }}
                  </p>
                </if>
                <if condition="book.link">
                  <p style="margin:16px 0 0 0;">
                    <a class="bd-button bd-mono" href="{{ book.link }}" style="display:inline-block;background:#f2ff3d;color:#000000!important;-webkit-text-fill-color:#000000;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:15px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;padding:11px 14px;border:2px solid #000000;">
                      {{ book.ctaText || 'Shop this book' }}
                    </a>
                  </p>
                </if>
              </td>
            </tr>
          </table>
        </each>
      </td>
    </tr>
  </table>
</if>

<if condition="(!books || !books.length) && productImages && productImages.length">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
    <tr>
      <td class="bd-pad bd-mono" align="center" style="padding:18px 32px 24px 32px;font-family:'Courier New',Courier,monospace;">
        <each loop="image in productImages">
          <img src="{{ image }}" alt="Product" width="176" style="display:inline-block;width:176px;max-width:176px;height:auto;margin:6px;">
        </each>
      </td>
    </tr>
  </table>
</if>
