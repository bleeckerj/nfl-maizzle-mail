<!-- Footer Component -->
<!-- Purpose: Renders sales email footer copy, social links, and optional unsubscribe affordance. -->
<!-- Variables: footer.paragraphs, footer.address, footer.socialLinks, footer.unsubscribeLink -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
  <tr>
    <td class="bd-pad bd-mono" style="padding:8px 32px 36px 32px;font-family:'Courier New',Courier,monospace;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-top:2px solid #000000;">
        <tr>
          <td align="left" style="padding:18px 0 0 0;">
            <if condition="footer && footer.paragraphs && footer.paragraphs.length">
              <each loop="paragraph in footer.paragraphs">
                <p style="margin:0 0 9px 0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:10px;color:#000000;">
                  {{{ paragraph }}}
                </p>
              </each>
            </if>
            <if condition="!(footer && footer.paragraphs && footer.paragraphs.length)">
              <p style="margin:0 0 9px 0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#0f0f0f;">
                You are receiving this email because you subscribed to Near Future Laboratory updates.
              </p>
            </if>
            <if condition="footer && footer.address">
              <p style="margin:0 0 9px 0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#0e0e0e;">
                {{{ footer.address }}}
              </p>
            </if>
            <if condition="!(footer && footer.address) && companyAddress">
              <p style="margin:0 0 9px 0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#0e0e0e;">
                {{{ companyAddress }}}
              </p>
            </if>
            <if condition="(footer && footer.socialLinks && footer.socialLinks.length) || (socialLinks && socialLinks.length)">
              <p style="margin:0 0 9px 0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#000000;">
                <each loop="link in ((footer && footer.socialLinks) || socialLinks)">
                  <a href="{{ link.url || link.href }}" style="color:#0e0e0e;text-decoration:underline;">{{ link.label || link.text || link.title }}</a><if condition="loop.index < ((footer && footer.socialLinks) || socialLinks).length - 1"><span style="padding:0 7px;color:#0e0e0e;">/</span></if>
                </each>
              </p>
            </if>
            <if condition="footer && footer.unsubscribeLink">
              <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#0e0e0e;">
                <a href="{{ footer.unsubscribeLink }}" style="color:#0e0e0e;text-decoration:underline;"><if condition="footer.unsubscribeLabel">{{ footer.unsubscribeLabel }}</if><if condition="!footer.unsubscribeLabel">Unsubscribe</if></a>
              </p>
            </if>
            <if condition="!(footer && footer.unsubscribeLink) && unsubscribeLink">
              <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:9px;line-height:11px;color:#0e0e0e;">
                <a href="{{ unsubscribeLink }}" style="color:#0e0e0e;text-decoration:underline;"><if condition="unsubscribeLabel">{{ unsubscribeLabel }}</if><if condition="!unsubscribeLabel">Unsubscribe</if></a>
              </p>
            </if>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
