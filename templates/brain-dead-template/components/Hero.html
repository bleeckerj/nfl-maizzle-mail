<!-- Hero Component -->
<!-- Purpose: Renders the main sales message for the offer. -->
<!-- Variables: hero.*, legacy collection* fields -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
  <tr>
    <td class="bd-pad" style="padding:16px 32px 20px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-top:6px solid #000000;">
        <tr>
          <td style="padding:18px 0 0 0;">
            <p class="bd-mono" style="margin:0 0 12px 0;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:18px;letter-spacing:0.12em;text-transform:uppercase;color:#000000;">
              {{ (hero && hero.eyebrow) || eyebrow || 'Books from the Lab' }}
            </p>
            <h1 class="bd-title bd-mono" style="margin:0;font-family:'Courier New',Courier,monospace;font-size:46px;line-height:48px;font-weight:700;letter-spacing:0;color:#000000;">
              {{ (hero && hero.headline) || collectionTitle || title }}
            </h1>
            <if condition="(hero && hero.subhead) || collectionDescription">
              <p class="bd-subtitle bd-mono" style="margin:18px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:18px;line-height:25px;font-weight:400;color:#000000;">
                {{ (hero && hero.subhead) || collectionDescription }}
              </p>
            </if>
          </td>
        </tr>
        <if condition="(hero && hero.image) || mainImage">
          <tr>
            <td style="padding:24px 0 0 0;">
              <!-- POLICY: the hero image must NOT auto-inherit the action CTA (e.g. a Zoom join link) -
                   clicking an image is not an intent to launch the event. It links only to an explicit
                   hero.imageLink, or shopLink for shop emails. Set hero.imageLink: 'none' to force no link. -->
              <if condition="hero && hero.imageLink && hero.imageLink !== 'none'">
                <a href="{{ hero.imageLink }}" style="text-decoration:none;">
                  <img src="{{ (hero && hero.image) || mainImage }}" alt="{{ (hero && hero.imageAlt) || collectionTitle || title }}" width="576" style="width:100%;max-width:576px;height:auto;">
                </a>
              </if>
              <if condition="!(hero && hero.imageLink) && shopLink">
                <a href="{{ shopLink }}" style="text-decoration:none;">
                  <img src="{{ (hero && hero.image) || mainImage }}" alt="{{ (hero && hero.imageAlt) || collectionTitle || title }}" width="576" style="width:100%;max-width:576px;height:auto;">
                </a>
              </if>
              <if condition="hero && hero.imageLink === 'none'">
                <img src="{{ (hero && hero.image) || mainImage }}" alt="{{ (hero && hero.imageAlt) || collectionTitle || title }}" width="576" style="width:100%;max-width:576px;height:auto;">
              </if>
              <if condition="!(hero && hero.imageLink) && !shopLink">
                <img src="{{ (hero && hero.image) || mainImage }}" alt="{{ (hero && hero.imageAlt) || collectionTitle || title }}" width="576" style="width:100%;max-width:576px;height:auto;">
              </if>
            </td>
          </tr>
        </if>
        <if condition="(hero && hero.body) || collectionDetails">
          <tr>
            <td style="padding:22px 0 0 0;">
              <p class="bd-copy bd-mono" style="margin:0;font-family:'Courier New',Courier,monospace;font-size:15px;line-height:22px;color:#000000;">
                {{{ (hero && hero.body) || collectionDetails }}}
              </p>
            </td>
          </tr>
        </if>
        <if condition="(hero && hero.ctaLink) || shopLink">
          <tr>
            <td style="padding:24px 0 4px 0;">
              <a class="bd-button bd-mono" href="{{ (hero && hero.ctaLink) || shopLink }}" style="display:inline-block;background:#000000;color:#ffffff!important;-webkit-text-fill-color:#ffffff;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:16px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;padding:14px 18px;border:2px solid #000000;">
                {{ (hero && hero.ctaText) || ctaText || 'Shop the set' }}
              </a>
            </td>
          </tr>
        </if>
      </table>
    </td>
  </tr>
</table>
