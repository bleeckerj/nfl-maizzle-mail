<!-- Header Component -->
<!-- Purpose: Displays the logo and navigation links -->
<!-- Variables: logoUrl, logoLink -->

<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      <div class="header" style="text-align: center; margin-bottom: 20px;">
        <a href="{{ logoLink }}">
          <img src="{{ logoUrl }}" alt="Brain Dead Logo" width="80" style="display: block; outline: none; text-decoration: none; height: auto; width: 80px; background-color: transparent;">
        </a>
      </div>
    </td>
  </tr>
</table>
