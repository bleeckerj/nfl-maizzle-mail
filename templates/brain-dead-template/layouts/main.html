<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{ title }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0;
      mso-table-rspace: 0;
    }

    img {
      border: 0;
      display: block;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
    }

    a {
      color: #000000;
      text-decoration: underline;
    }

    .bd-mono {
      font-family: "Courier New", Courier, monospace;
    }

    .bd-sans {
      font-family: Arial, Helvetica, sans-serif;
    }

    @media only screen and (max-width: 620px) {
      .bd-container {
        width: 100% !important;
      }

      .bd-pad {
        padding-left: 18px !important;
        padding-right: 18px !important;
      }

      .bd-title {
        font-size: 34px !important;
        line-height: 36px !important;
      }

      .bd-subtitle,
      .bd-copy,
      .bd-book-copy,
      .bd-item-copy {
        font-size: 17px !important;
        line-height: 24px !important;
      }

      .bd-book-image-cell,
      .bd-book-copy-cell,
      .bd-item-image-cell,
      .bd-item-copy-cell {
        display: block !important;
        width: 100% !important;
      }

      .bd-book-image-cell,
      .bd-item-image-cell {
        padding: 0 0 18px 0 !important;
      }

      .bd-book-image,
      .bd-item-image {
        width: 100% !important;
        max-width: 320px !important;
      }

      .bd-button {
        display: block !important;
        width: auto !important;
        text-align: center !important;
      }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
    {{ preheader || '' }}
  </div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#ffffff" style="width:100%;background:#ffffff;">
    <tr>
      <td align="center" style="padding:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="640" class="bd-container" style="width:640px;max-width:640px;background:#ffffff;">
          <tr>
            <td style="padding:0;">
              <block name="template"></block>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
