<!-- LinkList Component -->
<!-- Renders a list of miscellaneous links -->
<!-- Variables: link, description -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 20px;">
      <ul style="font-size: 18px; margin: 24px 0 0; padding: 0;"> <each loop="linkItem in linkItems"> <li style="margin: 0; padding: 12px 0; list-style: none; border-top: 1px solid #B7E2D8; line-height: 1.4em;"> <a href="{{ linkItem.link }}" style="color: #DC4B4B; text-decoration: none;">{{ linkItem.description }}</a> </li> </each> </ul>
    </td>
  </tr>
</table>
