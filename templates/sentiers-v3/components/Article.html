<!-- Article Component -->
<!-- Main article content with title, commentary, and quotes -->

<each loop="section in sections">
<if condition="section.type === 'article'">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 20px;">
      <each loop="item in section.items">
        <h2 style="font-family: 'Lora', serif; margin: 0; padding: 48px 0 0; font-size: 36px; line-height: 1.2em; font-weight: 400;">
          <a href="{{ item.url }}" style="color: #DC4B4B; text-decoration: none;">{{ item.title }}</a>
        </h2>
        {{{ item.commentary }}}
        <if condition="item.quotes">
          <blockquote style="margin: 40px 0; padding: 0 0 0 20px; border-left: 1px solid #B7E2D8;">
            {{{ item.quotes }}}
          </blockquote>
        </if>
      </each>
    </td>
  </tr>
</table>
</if>
</each>
