<!-- Header Component -->
<!-- Newsletter branding with logo and issue number -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding: 20px;">
      <div id="header" style="margin-bottom: 72px;">
        <img src="{{ header.logoUrl }}" id="logo" style="max-width: 300px; padding: 0; height: auto; margin: 0;" alt="{{ header.logoAlt }}">
        <h1 style="font-family: 'Lora', serif; margin: 12px 0 0; padding: 10px 0; float: right; line-height: 100%; font-weight: normal; border-bottom: 1px solid #465546;">{{ header.issueNumber }}</h1>
      </div>
    </td>
  </tr>
</table>
