<script props>
  // Stable indices preserve section identity after nested loops. The canonical
  // builder runs from the renderer root; all templates share this presentation helper.
  (() => {
    const section = props.sections[props.ctaSectionIndex];
    const present = require(require('path').resolve('lib/newsletter-core/inline-cta.cjs'));
    return { section, cta: present(section, 'near-future-lab-daily-headlines') };
  })()
</script>
