<script props>
  // Resolve stable article indices before the component loops through body blocks.
  (() => {
    const bodySection = props.sections[props.bodySectionIndex];
    return { bodySection, bodyArticle: bodySection.articles[props.bodyArticleIndex] };
  })()
</script>
<if condition="bodyArticle.body_blocks && bodyArticle.body_blocks.length">
  <each loop="bodyBlock, bodyBlockIndex in bodyArticle.body_blocks">
    <tr><td style="padding-top:16px;{{{ bodyArticle.articleContainerStylesInline || '' }}};{{{ bodyArticle.articleContentStylesInline || '' }}}">
      <if condition="bodyBlock.type === 'text'"><div class="article-body-copy" style="color:#333;margin:0;{{{ bodyArticle.articleLedeStylesInline || '' }}}">{{{ bodyBlock.html }}}</div></if>
      <if condition="bodyBlock.type === 'ad-block'"><component src="templates/near-future-lab-daily-headlines/components/AdBlock.html" locals='{"adSectionIndex": "{{bodySectionIndex}}", "adArticleIndex": "{{bodyArticleIndex}}", "adBodyBlockIndex": "{{bodyBlockIndex}}"}'></component></if>
      <if condition="bodyBlock.type === 'image'">
        <img src="{{ bodyBlock.src }}" alt="{{ bodyBlock.alt }}" width="600" class="article-image article-body-image" style="display:block;width:100%;max-width:600px;height:auto">
        <if condition="bodyBlock.caption"><p class="article-body-caption" style="color:#555;font:14px/20px georgia,serif;margin:8px 0 0">{{ bodyBlock.caption }}</p></if>
      </if>
    </td></tr>
  </each>
  <if condition="bodyArticle.cta_label">
    <tr><td style="padding-top:16px;{{{ bodyArticle.articleContainerStylesInline || '' }}}">
      <if condition="bodyArticle.link || bodyArticle.href"><a href="{{ bodyArticle.link || bodyArticle.href }}" style="color:#111;text-decoration:none"><span class="article-cta-pill" style="{{ bodySection.articleCtaStylesInline }}">{{ bodyArticle.cta_label }}</span></a></if>
      <if condition="!(bodyArticle.link || bodyArticle.href)"><span class="article-cta-pill" style="{{ bodySection.articleCtaStylesInline }}">{{ bodyArticle.cta_label }}</span></if>
    </td></tr>
  </if>
</if>
<!-- Each article's follow-up stays after its complete body, outside card anchors. -->
<if condition="bodyArticle.more_link && bodyArticle.more_link.label && (bodyArticle.more_link.link || bodyArticle.more_link.href)">
  <tr><td style="padding-top:16px;{{{ bodyArticle.articleContainerStylesInline || '' }}}">
    <p class="article-more-link" style="color:#333;margin:0;{{{ bodyArticle.articleLedeStylesInline || '' }}}"><a href="{{ bodyArticle.more_link.link || bodyArticle.more_link.href }}" style="color:inherit;font:inherit;text-decoration:underline">{{ bodyArticle.more_link.label }}</a></p>
  </td></tr>
</if>
