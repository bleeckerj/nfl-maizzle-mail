<script props>
  // Resolve stable indices for standalone ads and ads inside an intro body.
  (() => {
    const parent = props.sections[Number(props.adSectionIndex)];
    const adSection = props.adBodyBlockIndex == null
      ? parent
      : parent.body_blocks[Number(props.adBodyBlockIndex)];
    return { adSection };
  })()
</script>
