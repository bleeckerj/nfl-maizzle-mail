<script props>
  // Resolve stable indices for standalone ads and ads inside intro or article bodies.
  (() => {
    const section = props.sections[Number(props.adSectionIndex)];
    const parent = props.adArticleIndex == null ? section : section.articles[Number(props.adArticleIndex)];
    const adSection = props.adBodyBlockIndex == null
      ? parent
      : parent.body_blocks[Number(props.adBodyBlockIndex)];
    return { adSection };
  })()
