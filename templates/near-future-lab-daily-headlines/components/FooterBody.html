<!--
  Footer Body
  Structured replacement for the raw-HTML `footer_html` blob that the email_footer
  section used to carry. Authors set fields (boilerplate paragraphs, an address /
  legal line, an unsubscribe label, optional social links) and this component
  supplies all the table-row + paragraph chrome, matching the decompiled footer.

  Rendered as the body of the `mob-text mob-footer` table, immediately after the
  FooterCta bar. `footer_html` is kept as a legacy fallback: if NO structured
  field is present, the section's raw `footer_html` is dumped verbatim instead so
  existing issues keep rendering unchanged.

  Slots (all optional):
  - paragraphs (string[])     — Boilerplate / legal body paragraphs (the #666 block under the
                                heavy black rule). Each entry is one paragraph's inner HTML and
                                may contain simple inline markup including <a href> links.
                                See the link-tracking note below.
  - address (text/html)       — The lighter #999 legal line (org, location, copyright). May
                                contain an inline <a> (e.g. the publication link). Rendered in
                                the same paragraph as the unsubscribe link, separated by &nbsp;.
  - unsubscribe_label (text)  — Visible text for the unsubscribe link (e.g. "Unsubscribe"). The
                                link is omitted entirely when this is absent.
  - unsubscribe_href (string) — Href for the unsubscribe link. Default: "[unsubscribe]" (the ESP
                                merge-tag placeholder, left unvalidated by the live-link check).
  - social_links (object[])   — Optional row of social/profile links above the address line. Each
                                is { label, href, category? }; data-link-* attributes are emitted
                                from label + category (default category "social").
  - footer_html (rich_text)   — LEGACY fallback only. The complete inner HTML of the footer table
                                (the <tr><td>… rows). Used verbatim when no structured slot is set.

  Link tracking note:
  Inline <a> tags inside `paragraphs` / `address` carry their own
  data-link-category / data-link-label (same convention as the legacy footer_html,
  and the post-render enricher will not overwrite attributes you set). Anchors
  without those attributes are only enriched if their href matches a tracked link
  used elsewhere in the issue — so add the data-link-* attributes here for footer
  links, or keep the href real/mailto so the live-link check passes.

  Used by section indexes: [31] in the source email.
  Reference only — render-time dispatch is inlined in templates/<name>/newsletter.html
  (the email_footer branch), because the body reads the loop-local `section`.
-->
<if condition="section.paragraphs || section.address || section.social_links || section.unsubscribe_label">
  <tr><td style="height:15px"></td></tr>
  <if condition="section.paragraphs && section.paragraphs.length">
    <tr><td style="padding:12px 0;border-top:1px solid #000"><each loop="paragraph in section.paragraphs"><p style="font:12px/15px arial,sans-serif;color:#666;margin:0 0 7px">{{{ paragraph }}}</p></each></td></tr>
  </if>
  <if condition="section.address || (section.social_links && section.social_links.length) || section.unsubscribe_label">
    <tr><td style="border-top:1px solid #dcdcdc;padding:10px 0 30px"><if condition="section.social_links && section.social_links.length"><p style="font:12px/15px arial,sans-serif;color:#999;margin:0 0 7px"><each loop="social in section.social_links"><a href="{{ social.href }}" data-link-category="{{ social.category || 'social' }}" data-link-label="{{ social.label }}" style="color:#999;text-decoration:underline;margin-right:12px">{{ social.label }}</a></each></p></if><p style="color:#999;font:12px/15px arial,sans-serif;margin:0"><if condition="section.address">{{{ section.address }}}</if><if condition="section.unsubscribe_label">&nbsp;<a href="{{ section.unsubscribe_href || '[unsubscribe]' }}" style="color:#999;text-decoration:underline">{{ section.unsubscribe_label }}</a></if></p></td></tr>
  </if>
</if>
<if condition="!(section.paragraphs || section.address || section.social_links || section.unsubscribe_label)">{{{ section.footer_html }}}</if>
