<!--
  Masthead Ad Bar
  Top-of-email bar with a 'View in browser' link and an inline ad image (desktop + mobile variants).

  Slots:
  - viewOnlineLink (link_url) — Tracked URL for the 'View in browser' link; legacy view_in_browser_href is still rendered as a fallback
  - sponsorLink (link_url) — Tracked sponsor URL the ad image links to; legacy ad_href is still rendered as a fallback
  - ad_src_desktop (image_url) — Desktop ad image src (600px)
  - ad_src_mobile (image_url) — Mobile ad image src (480px)

  Used by section indexes: [0] in the source email.
  Reference only — render-time dispatch is in templates/<name>/newsletter.html.
-->
<table border="0" cellpadding="0" cellspacing="0" style="width:100%"><tbody><tr><td height="15"></td></tr><tr><td style="padding:15px 0 5px;text-align:right;width:100%;font-family:arial,sans-serif;font-size:12px"><a title="View in browser" href="{{ section.viewOnlineLink || section.view_in_browser_href }}" style="color:#666;-webkit-text-decoration:none;text-decoration:none;line-height:18px">View in browser</a><table border="0" cellpadding="0" cellspacing="0" style="width:100%"><tbody><tr aria-hidden="true"><td><span style="text-align:center"><table style="margin:0 auto" border="0" cellpadding="0" cellspacing="0"><tbody><tr><td style="line-height:0;font-size:0"><a rel="noopener noreferrer nofollow" tabindex="-1" target="_blank" href="{{ section.sponsorLink || section.ad_href }}"><img src="{{ section.ad_src_desktop }}" alt="Ad" border="0" width="600" style="display:block;width:100%;max-width:600px"></a></td></tr><tr style="display:none"><td style="line-height:0;font-size:0"><a rel="noopener noreferrer nofollow" tabindex="-1" target="_blank" href="{{ section.sponsorLink || section.ad_href }}"><img src="{{ section.ad_src_mobile }}" alt="Ad" border="0" width="480" style="display:block;width:100%;max-width:480px"></a></td></tr></tbody></table></span></td></tr><tr><td height="10"></td></tr></tbody></table></td></tr><tr><td height="5"></td></tr></tbody></table>
