<!-- Hero Component -->
<!-- Purpose: Displays the main hero image and story -->
<!-- Variables: hero.title, hero.subtitle, hero.image, hero.url -->

<div class="content-block" style="padding: 20px;">
  <if condition="hero">
    <div class="hero-section" style="margin: 30px 0;">
      <if condition="hero.image">
        <a href="{{ hero.url }}" style="display: block; text-decoration: none;">
          <img src="{{ hero.image.src }}" alt="{{ hero.image.alt }}" style="max-width: 100%; height: auto; display: block; margin: 0 0 20px 0;">
        </a>
      </if>
      <if condition="hero.title">
        <h2 style="font-family: 'Lora', serif; margin: 0 0 10px 0; font-size: 28px; line-height: 1.3em; font-weight: 400;">
          <a href="{{ hero.url }}" style="color: #DC4B4B; text-decoration: none;">{{ hero.title }}</a>
        </h2>
      </if>
      <if condition="hero.subtitle">
        <p style="font-size: 18px; line-height: 1.6em; color: #666; margin: 0 0 20px 0;">{{ hero.subtitle }}</p>
      </if>
    </div>
  </if>
</div>
