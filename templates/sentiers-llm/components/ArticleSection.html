<!-- ArticleSection Component -->
<!-- Purpose: Contains individual articles with titles, images, and descriptions -->
<!-- Variables: articleTitle, articleLink, articleImage, articleDescription -->

<div class="content-block" style="padding: 20px;">
  <!-- <h2><a href='...'>...</a></h2><p>...</p><blockquote>...</blockquote> -->
  <div class="articlesection">
    <each loop="article in articles">
      <h2 style="font-family: 'Lora', serif; margin: 0; padding: 48px 0 0; font-size: 36px; line-height: 1.2em; font-weight: 400;">
        <a href="{{ article.url }}" style="color: #DC4B4B; text-decoration: none;">{{ article.title }}</a>
      </h2>
      <if condition="article.image">
        <img src="{{ article.image.src }}" alt="{{ article.image.alt }}" style="max-width: 100%; height: auto; margin: 20px 0;">
      </if>
      <p style="font-size: 18px; line-height: 1.6em;">{{ article.summary }}</p>
    </each>
    
    <!-- Markdown Content Section -->
    <if condition="markdownContent">
    <div style="margin: 40px 0; padding: 20px 0; border-top: 1px solid #eee;">
      <div style="font-size: 18px; line-height: 1.6em; color: #333;">
        {{{ markdownContent }}}
      </div>
    </div>
    </if>
  </div>
</div>
