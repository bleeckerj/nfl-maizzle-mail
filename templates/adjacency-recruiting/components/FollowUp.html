<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td class="recruit-pad" style="padding:28px 40px 34px;border-top:1px solid #cbd5e3;">
  <h2 style="margin:0 0 14px;font-size:25px;line-height:31px;color:#101e35;">Interested in the role?</h2>
  <p style="margin:0 0 22px;font-size:17px;line-height:27px;">{{ followUp }}</p>
  <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#2459df" style="background-color:#2459df;">
 <a href="{{ job.link }}" data-link-role="primary" style="display:inline-block;border:16px solid #2459df;background-color:#2459df;color:#ffffff;font-size:16px;line-height:20px;font-weight:bold;text-decoration:none;mso-padding-alt:0;text-align:center;">{{ job.ctaLabel }} <span aria-hidden="true">&#8594;</span></a>
 </td></tr></table>
  <p style="margin:24px 0 0;font-size:15px;line-height:24px;color:#354359;">{{ recruiter.signature }}<br><strong><if condition="recruiter.name === 'The Adjacency'"><a href="https://theadjacency.com/subscribe" data-link-label="The Adjacency | subscribe" data-link-category="subscription" style="color:#354359;text-decoration:underline;">{{ recruiter.name }}</a></if><else>{{ recruiter.name }}</else></strong></p>
 </td></tr>
</table>
