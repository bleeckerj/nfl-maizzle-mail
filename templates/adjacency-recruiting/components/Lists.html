<each loop="section in sections">
 <if condition="section.type === 'recruiting-list'">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="recruit-pad" style="padding:28px 40px 0;">
   <h2 style="margin:0 0 14px;font-size:23px;line-height:29px;color:#101e35;">{{ section.title }}</h2>
   <ul style="margin:0;padding-left:20px;"><each loop="item in section.items"><li style="padding:0 0 12px 3px;font-size:16px;line-height:25px;">{{ item.text }}</li></each></ul>
  </td></tr></table>
 </if>
 <if condition="section.type === 'recruiting-image'">
  <component src="templates/adjacency-recruiting/components/RecruitingImage.html" locals='{{ JSON.stringify({section}) }}'></component>
 </if>
 <if condition="section.type === 'ad-block' && section.placement === 'inline'">
  <component src="templates/adjacency-recruiting/components/Sponsor.html" locals='{{ JSON.stringify({section}) }}'></component>
 </if>
</each>
