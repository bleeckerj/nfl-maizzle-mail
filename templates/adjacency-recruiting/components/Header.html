<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#101e35">
 <tr><td class="recruit-pad" style="padding:28px 40px 26px;border-top:6px solid #2960ed;">
  <p style="margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:29px;line-height:34px;color:#ffffff;">{{ recruiter.name }}</p>
  <p style="margin:0;font-size:11px;line-height:17px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#b4c9ef;">{{ recruiter.desk }}</p>
 </td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="recruit-pad" style="padding:32px 40px 22px;">
 <p style="margin:0 0 14px;font-size:17px;line-height:27px;">{{ greeting }}</p>
 <each loop="paragraph in introduction"><p style="margin:0 0 14px;font-size:17px;line-height:27px;color:#354359;">{{ paragraph }}</p></each>
</td></tr></table>
