<if condition="share.enabled">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#2459df"><tr><td class="recruit-pad" style="padding:32px 40px 36px;border-top:1px solid #ffffff;">
 <h2 style="margin:0 0 14px;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:38px;font-weight:normal;color:#ffffff;">{{ share.heading }}</h2>
 <p style="margin:0 0 24px;font-size:16px;line-height:26px;color:#ffffff;">{{ share.text }}</p>
 <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#ffffff" style="border:1px solid #ffffff;border-radius:4px;text-align:center;mso-padding-alt:15px 22px;">
  <a href="{{ share.emailHref }}" data-link-role="share" data-link-label="Recruiting | share by email" data-link-category="share" style="display:inline-block;padding:15px 22px;color:#101e35;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;font-weight:bold;text-decoration:none;mso-padding-alt:0;">{{ share.buttonLabel }} <span aria-hidden="true">&#8594;</span></a>
 </td></tr></table>
</td></tr></table>
</if>
