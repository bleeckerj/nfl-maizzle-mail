<if condition="share.enabled">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="recruit-pad" style="padding:28px 40px 32px;">
 <h2 style="margin:0 0 12px;font-size:24px;line-height:30px;color:#101e35;">{{ share.heading }}</h2>
 <p style="margin:0 0 20px;font-size:16px;line-height:25px;">{{ share.text }}</p>
 <a href="{{ share.emailHref }}" data-link-role="share" data-link-label="Recruiting | share by email" data-link-category="share" style="display:inline-block;background-color:#101e35;border:14px solid #101e35;color:#ffffff;font-size:15px;line-height:20px;font-weight:bold;text-decoration:none;">{{ share.buttonLabel }}</a>
</td></tr></table>
</if>
