<!-- Placement and gutters belong to recruiting; ad content uses dense-discovery's canonical markup. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" data-section-type="ad-block" data-sponsor-placement="{{ section.placement || 'after-recruiting' }}">
 <tr><td class="recruit-pad" style="padding:24px 40px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
   <tr><td><p style="margin:0;font-size:11px;line-height:17px;letter-spacing:2px;font-weight:bold;color:#536078;">{{ section.sponsorLabel || 'SPONSOR' }}</p></td></tr>
   <component src="templates/dense-discovery/components/AdBlock.html" locals='{{ JSON.stringify({section}) }}'></component>
  </table>
 </td></tr>
</table>
