  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
   <if condition="section.label && section.label.trim()"><tr><td><p style="margin:0;font-size:11px;line-height:17px;letter-spacing:2px;font-weight:bold;color:#536078;">{{ section.label }}</p></td></tr></if>
   <component src="templates/dense-discovery/components/AdBlock.html" locals='{"adSectionIndex":{{ typeof adSectionIndex !== "undefined" ? adSectionIndex : "null" }}}'></component>

 </td></tr>
