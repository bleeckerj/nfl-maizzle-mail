<table role="presentation" width="100%" cellpadding="0" cellspacing="0" data-section-type="ad-block" data-sponsor-placement="{{ section.placement || 'after-recruiting' }}">
 <tr><td class="recruit-pad" style="padding:20px 40px 10px;border-top:1px solid #cbd5e3;"><p style="margin:0;font-size:11px;line-height:17px;letter-spacing:2px;font-weight:bold;color:#536078;">{{ section.sponsorLabel || 'SPONSOR' }}</p></td></tr>
 <each loop="item in section.items">
 <if condition="item.label"><tr><td class="recruit-pad" style="padding:6px 40px 16px;"><p style="margin:0;font-size:11px;line-height:17px;letter-spacing:1px;color:#536078;">{{ item.label }}</p></td></tr></if>
 <if condition="item.image"><tr><td style="padding:0;">
  <if condition="item.link"><a href="{{ item.link }}" data-link-role="advertisement" style="display:block;"><img src="{{ item.image }}" alt="{{ item.imageAlt }}" width="640" style="display:block;width:100%;max-width:640px;height:auto;"></a></if>
  <if condition="!item.link"><img src="{{ item.image }}" alt="{{ item.imageAlt }}" width="640" style="display:block;width:100%;max-width:640px;height:auto;"></if>
 </td></tr></if>
 <if condition="item.title || section.title || item.description || item.sponsor || item.readMoreLink"><tr><td class="recruit-pad" style="padding:18px 40px 26px;">
  <if condition="item.title || section.title"><h2 style="margin:0 0 12px;font-size:22px;line-height:28px;">{{ item.title || section.title }}</h2></if>
  <if condition="item.description"><div style="font-size:16px;line-height:25px;">{{{ item.description }}}</div></if>
  <if condition="item.sponsor"><p style="margin:12px 0 0;font-size:11px;line-height:17px;letter-spacing:1px;color:#536078;">{{ item.sponsor }}</p></if>
  <if condition="item.readMoreLink"><p style="margin:12px 0 0;"><a href="{{ item.readMoreLink }}" data-link-role="advertisement" style="font-size:14px;line-height:22px;color:#2459df;">{{ item.readMoreText }}</a></p></if>
 </td></tr></if>
 </each>
</table>
