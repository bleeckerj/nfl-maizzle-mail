<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="x-apple-disable-message-reformatting"><meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
 <title>{{ title }}</title>
 <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
 <style>
 body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
 table,td{mso-table-lspace:0pt;mso-table-rspace:0pt} table{border-collapse:collapse}
 img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}
 @media screen and (max-width:680px){
 .recruit-shell{width:100%!important}.recruit-pad{padding-left:24px!important;padding-right:24px!important}
 .recruit-title{font-size:36px!important;line-height:39px!important}
 .recruit-outer{padding:0!important}.recruit-fact-label{width:100px!important}
 }
 </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#eaf0f6;color:#172338;font-family:Arial,Helvetica,sans-serif;">
 <div style="display:none;font-size:0;line-height:0;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{ preheader }}</div>
 <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#eaf0f6"><tr><td class="recruit-outer" align="center" style="padding:32px 12px;">
 <table role="presentation" width="640" class="recruit-shell" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="width:640px;max-width:640px;"><tr><td><block name="template"></block></td></tr></table>
 </td></tr></table>
</body></html>
