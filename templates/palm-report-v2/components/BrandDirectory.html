<!-- BrandDirectory Component -->
<!-- Curated list of lifestyle brands with descriptions -->
<!-- Variables: , ,  -->

<table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
  <tr>
    <td class="mlContentTableCardTd">
      <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
        <tr>
          <td>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="60" class="spacingHeight-60" style="line-height: 60px; min-height: 60px;"></td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td align="center" style="padding: 0px 0px;" class="">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                    <tr>
                      <td align="center">
                        <img src="{{ brands.headerImage }}" border="0" alt="" width="640" style="display: block;">
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
  <tr>
    <td class="mlContentTableCardTd">
      <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
        <tr>
          <td>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="20" class="spacingHeight-20" style="line-height: 20px; min-height: 20px;"></td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td align="center" style="padding: 0px 40px;" class="mlContentOuter">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                    <tr>
                      <td class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 14px; line-height: 150%; color: #000000;">
                        {{{ brands.introText }}}
                        <each loop="brand in brands.brandList">
                          <p style="margin-top: 0px; margin-bottom: 10px; line-height: 150%;"><a href="{{ brand.url }}" target="_blank" style="word-break: break-word; font-family: Helvetica, sans-serif; color: #2664F6; text-decoration: underline;">{{ brand.name }}</a> {{{ brand.description }}}</p>
                        </each>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="30" class="spacingHeight-30" style="line-height: 30px; min-height: 30px;"></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
