<!-- Footer Component -->
<!-- Newsletter footer with social links, company info, and unsubscribe -->
<!-- Variables: , , ,  -->

<table align="center" border="0" bgcolor="#FFFCF2" class="mlContentTable mlContentTableFooterDefault" cellpadding="0" cellspacing="0" width="640">
  <tr>
    <td class="mlContentTableFooterCardTd">
      <table align="center" bgcolor="#FFFCF2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
        <tr>
          <td>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="80" class="spacingHeight-80" style="line-height: 80px; min-height: 80px;"></td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td align="center" style="padding: 0px 150px;" class="mlContentOuter">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                    <tr>
                      <td align="center">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                          <tr>
                            <each loop="link in footer.socialLinks">
                              <td align="center" width="24" style="padding: 0px 5px;">
                                <a href="{{ link.url }}" target="_blank">
                                  <img width="24" alt="{{ link.platform }}" src="{{ link.icon }}" style="display: block;" border="0">
                                </a>
                              </td>
                            </each>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td height="20" class="spacingHeight-20"></td>
                    </tr>
                    <tr>
                      <td align="center" class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 12px; line-height: 100%; color: #111111;">
                        {{{ footer.companyInfo }}}
                      </td>
                    </tr>
                    <tr>
                      <td height="25" class="spacingHeight-20"></td>
                    </tr>
                    <tr>
                      <td align="center" class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 12px; line-height: 150%; color: #111111;">
                        {{{ footer.subscriptionInfo }}}
                      </td>
                    </tr>
                    <tr>
                      <td height="10"></td>
                    </tr>
                    <tr>
                      <td align="center" class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 12px; line-height: 150%; color: #111111;">
                        <a href="{{ footer.unsubscribeLink }}" style="color: #111111; text-decoration: underline;">
                          <span style="color: #111111;">Unsubscribe</span>
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="40" class="spacingHeight-40" style="line-height: 40px; min-height: 40px;"></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
