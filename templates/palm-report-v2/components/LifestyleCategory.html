<!-- LifestyleCategory Component -->
<!-- Themed content sections with title, images, and descriptive text -->
<!-- Variables: categories array with title, featuredImage, description, additionalImages -->

<each loop="category in categories">
<table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
  <tr>
    <td class="mlContentTableCardTd">
      <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
        <tr>
          <td>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="20" class="spacingHeight-20" style="line-height: 20px; min-height: 20px;"></td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td align="center" style="padding: 0px 40px;" class="mlContentOuter">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                    <tr>
                      <td align="center" class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 20px; font-weight: 700; line-height: 150%; color: #2664F6; text-transform: none; font-style: normal; text-decoration: none; text-align: center;">{{ category.title }}</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
              <tr>
                <td height="20" class="spacingHeight-20" style="line-height: 20px; min-height: 20px;"></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<if condition="category.featuredImage">
  <table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
    <tr>
      <td class="mlContentTableCardTd">
        <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
          <tr>
            <td>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td align="center" style="padding: 0px 0px;" class="">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                      <tr>
                        <td align="center">
                          <if condition="category.featuredImageLink">
                            <a href="{{ category.featuredImageLink }}" target="_blank">
                              <img src="{{ category.featuredImage }}" border="0" alt="" width="640" style="display: block;">
                            </a>
                          </if>
                          <if condition="!category.featuredImageLink">
                            <img src="{{ category.featuredImage }}" border="0" alt="" width="640" style="display: block;">
                          </if>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td height="30" class="spacingHeight-30" style="line-height: 30px; min-height: 30px;"></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</if>
<if condition="category.description">
  <table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
    <tr>
      <td class="mlContentTableCardTd">
        <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
          <tr>
            <td>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td height="30" class="spacingHeight-30" style="line-height: 30px; min-height: 30px;"></td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td align="center" style="padding: 0px 40px;" class="mlContentOuter">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                      <tr>
                        <td class="bodyTitle" style="font-family: Helvetica, sans-serif; font-size: 14px; line-height: 150%; color: #000000;">
                          {{{ category.description }}}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td height="20" class="spacingHeight-20" style="line-height: 20px; min-height: 20px;"></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</if>
<each loop="image in category.additionalImages">
  <table align="center" border="0" bgcolor="#fffcf2" class="mlContentTable mlContentTableDefault" cellpadding="0" cellspacing="0" width="640">
    <tr>
      <td class="mlContentTableCardTd">
        <table align="center" bgcolor="#fffcf2" border="0" cellpadding="0" cellspacing="0" class="mlContentTable ml-default" style="width: 640px; min-width: 640px;" width="640">
          <tr>
            <td>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="640" style="width: 640px; min-width: 640px;" class="mlContentTable">
                <tr>
                  <td align="center" style="padding: 0px 0px;" class="">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
                      <tr>
                        <td align="center">
                          <if condition="image.link">
                            <a href="{{ image.link }}" target="_blank">
                              <img src="{{ image.url }}" border="0" alt="" width="640" style="display: block;">
                            </a>
                          </if>
                          <if condition="!image.link">
                            <img src="{{ image.url }}" border="0" alt="" width="640" style="display: block;">
                          </if>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</each>
</each>
