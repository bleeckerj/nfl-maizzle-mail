<table role="presentation" width="100%"><tr><td class="gdm-pad" style="padding:36px 48px 28px;">
<p style="margin:0 0 16px;font-size:12px;line-height:18px;color:#5f6368;">{{ job.department }} &nbsp; / &nbsp; {{ job.reference }}</p>
<h1 class="gdm-title" style="margin:0 0 22px;font-size:40px;line-height:46px;font-weight:400;letter-spacing:-1px;color:#202124;">{{ job.title }}</h1>
<p style="margin:0;font-size:16px;line-height:25px;color:#5f6368;">{{ job.team }}</p>
<p style="margin:24px 0 0;"><a href="{{ job.link }}" data-link-role="primary" style="display:inline-block;border:1px solid #dadce0;border-radius:24px;padding:12px 22px;font-size:14px;line-height:20px;text-decoration:none;color:#202124;">{{ job.ctaLabel }} &nbsp; &#8599;</a></p>
</td></tr></table>
<if condition="job.image"><table role="presentation" width="100%"><tr><td><img src="{{ job.image.src }}" alt="{{ job.image.alt }}" width="680" style="display:block;width:100%;height:auto;"></td></tr><if condition="job.image.caption"><tr><td class="gdm-pad" style="padding:12px 48px;"><p style="margin:0;font-size:12px;line-height:20px;">{{ job.image.caption }}</p></td></tr></if></table></if>
