<!-- Feature Section Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      
      <!-- Feature Layout: Image Left, Content Right -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <!-- Feature Image -->
          <td width="180" valign="top" style="padding-right: 20px;">
            <a href="{{ feature.url }}" style="text-decoration: none; display: block;">
              <img src="{{ feature.image.src }}" alt="{{ feature.image.alt }}" width="180" style="width: 100%; max-width: 180px; height: auto; display: block;" />
            </a>
          </td>
          
          <!-- Feature Content -->
          <td valign="top">
            <!-- Feature Title -->
            <h2 class="headline" style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; line-height: 1.3; margin: 0 0 12px 0; color: #333333; font-weight: bold;">
              <a href="{{ feature.url }}" style="color: #333333; text-decoration: none;">{{ feature.title }}</a>
            </h2>
            
            <!-- Feature Content -->
            <div class="body-text" style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #333333;">
              {{{ feature.html }}}
            </div>
          </td>
        </tr>
      </table>
      
    </td>
  </tr>
</table>
