<!-- Two-Up Block Component -->
<if condition="moreBlocks">
  <each loop="block in moreBlocks">
    <table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr>
        <td class="content-block" style="padding: 20px;">
          
          <!-- Block Header -->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
            <tr>
              <td>
                <h2 class="headline" style="font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 1.3; margin: 0; color: #333333; font-weight: bold;">
                  <a href="{{ block.url }}" style="color: #333333; text-decoration: none;">{{ block.title }}</a>
                </h2>
              </td>
            </tr>
          </table>
          
          <!-- Block Items -->
          <if condition="block.items">
            <each loop="item in block.items">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
                <tr>
                  <!-- Item Image -->
                  <td width="120" valign="top" style="padding-right: 15px;">
                    <a href="{{ item.url }}" style="text-decoration: none; display: block;">
                      <img src="{{ item.image.src }}" alt="{{ item.image.alt }}" width="120" style="width: 100%; max-width: 120px; height: auto; display: block;" />
                    </a>
                  </td>
                  
                  <!-- Item Content -->
                  <td valign="top">
                    <!-- Item Title -->
                    <h3 style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.3; margin: 0 0 8px 0; color: #333333; font-weight: bold;">
                      <a href="{{ item.url }}" style="color: #333333; text-decoration: none;">{{ item.title }}</a>
                    </h3>
                    
                    <!-- Item Copy -->
                    <p class="body-text" style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4; margin: 0; color: #555555;">
                      {{ item.copy }}
                    </p>
                  </td>
                </tr>
              </table>
            </each>
          </if>
          
        </td>
      </tr>
    </table>
  </each>
</if>
