<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings xmlns:o="urn:schemas-microsoft-com:office:office">
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <style>
    td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: "Segoe UI", sans-serif; mso-line-height-rule: exactly;}
  </style>
  <![endif]-->
  
  <title>{{ title }}</title>
  
  <style>
    @import "tailwindcss/base" screen;
    @import "tailwindcss/components" screen;
    @import "tailwindcss/utilities" screen;
  </style>
  
  <!-- Custom email styles -->
  <style>
    /* Email client resets */
    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
    }
    
    /* Responsive styles */
    @media screen and (max-width: 600px) {
      .wrapper {
        width: 100% !important;
      }
      
      .content-block {
        padding: 15px !important;
      }
      
      .headline {
        font-size: 22px !important;
      }
      
      .responsive-image {
        width: 100% !important;
        height: auto !important;
      }
      
      /* Stack tables on mobile */
      .mobile-stack {
        display: block !important;
        width: 100% !important;
      }
      
      .mobile-stack td {
        display: block !important;
        width: 100% !important;
        padding-right: 0 !important;
        padding-bottom: 15px !important;
      }
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      .dark-bg {
        background-color: #1a1a1a !important;
      }
      
      .dark-text {
        color: #ffffff !important;
      }
      
      .dark-subtext {
        color: #cccccc !important;
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; width: 100%; word-break: break-word; -webkit-font-smoothing: antialiased; background-color: #ffffff;">
  
  <!-- Preview text -->
  <div style="display: none; font-size: 1px; color: #fefefe; line-height: 1px; font-family: Arial, sans-serif; max-height: 0; max-width: 0; opacity: 0; overflow: hidden;">
    {{ preheader }}
  </div>
  
  <!-- Email wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
    <tr>
      <td align="center" style="padding: 0;">
        
        <!-- Main content container -->
        <table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; margin: 0 auto;">
          <tr>
            <td>
              
              <block name="template">
                <!-- Template content goes here -->
              </block>
              
            </td>
          </tr>
        </table>
        
      </td>
    </tr>
  </table>
  
</body>
</html>
