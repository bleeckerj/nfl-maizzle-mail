<!-- Footer Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 30px 20px; background-color: #f8f8f8;">
      
      <!-- Footer Logo -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
        <tr>
          <td align="center">
            <img src="{{ footer.lockup.src }}" alt="{{ footer.lockup.alt }}" width="150" style="width: 100%; max-width: 150px; height: auto; display: block;" />
          </td>
        </tr>
      </table>
      
      <!-- Legal Text -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
        <tr>
          <td align="center">
            <div class="footer-text" style="font-family: Arial, sans-serif; font-size: 12px; line-height: 1.4; color: #666666; text-align: center;">
              {{{ footer.legal }}}
            </div>
          </td>
        </tr>
      </table>
      
      <!-- Footer Links -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="footer-text" style="font-family: Arial, sans-serif; font-size: 12px; line-height: 1.4; color: #666666; padding: 0 10px;">
                  <a href="{{ footer.links.privacy }}" class="footer-link" style="color: #007cba; text-decoration: underline;">Privacy Policy</a>
                </td>
                <td class="footer-text" style="font-family: Arial, sans-serif; font-size: 12px; line-height: 1.4; color: #666666; padding: 0 10px;">
                  <a href="{{ footer.links.tos }}" class="footer-link" style="color: #007cba; text-decoration: underline;">Terms of Service</a>
                </td>
                <td class="footer-text" style="font-family: Arial, sans-serif; font-size: 12px; line-height: 1.4; color: #666666; padding: 0 10px;">
                  <a href="{{ footer.links.contact }}" class="footer-link" style="color: #007cba; text-decoration: underline;">Contact Us</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      
    </td>
  </tr>
</table>
