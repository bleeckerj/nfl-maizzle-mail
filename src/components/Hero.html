<!-- Hero Section Component -->
<table class="wrapper" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td class="content-block" style="padding: 20px;">
      
      <!-- Hero Image -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
        <tr>
          <td>
            <a href="{{ hero.url }}" style="text-decoration: none; display: block;">
              <img src="{{ hero.image.src }}" alt="{{ hero.image.alt }}" width="560" class="responsive-image" style="width: 100%; max-width: 560px; height: auto; display: block;" />
            </a>
          </td>
        </tr>
      </table>
      
      <!-- Hero Content -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td>
            <!-- Hero Title -->
            <h1 class="headline" style="font-family: Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 1.3; margin: 0 0 16px 0; color: #333333; font-weight: bold;">
              <a href="{{ hero.url }}" style="color: #333333; text-decoration: none;">{{ hero.title }}</a>
            </h1>
            
            <!-- Hero Deck -->
            <p class="subhead" style="font-family: Arial, sans-serif; font-size: 18px; line-height: 1.4; margin: 0 0 20px 0; color: #555555;">
              {{ hero.deck }}
            </p>
            
            <!-- Hero CTA -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius: 4px; background-color: #007cba;">
                  <a href="{{ hero.cta.href }}" class="cta-button" style="display: inline-block; padding: 12px 24px; background-color: #007cba; color: #ffffff; text-decoration: none; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; border-radius: 4px;">
                    {{ hero.cta.label }}
                  </a>
                </td>
              </tr>
            </table>
            
          </td>
        </tr>
      </table>
      
    </td>
  </tr>
</table>
